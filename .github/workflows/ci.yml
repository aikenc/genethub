name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release calls this with force_full=true. Ordinary push/PR never do — the
  # full suite is the tag's cost, not every merge to main.
  workflow_call:
    inputs:
      force_full:
        description: Run every job regardless of changed paths
        type: boolean
        required: false
        default: false

# One live run per PR (or branch). A newer push cancels the rest — otherwise the
# queue is full of superseded builds while the reviewer waits on the latest tip.
# Release invocations get their own group so a tag verify cannot cancel a PR.
concurrency:
  group: >-
    open-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.force_full || 'path' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  # Decide which heavy jobs this change actually needs. The decision lives in
  # scripts/ci-classify.mjs (table-tested by scripts/ci-classify.test.mjs);
  # main push and pull requests share it, only release (force_full) runs
  # everything. The release type is NOT decided here — it is a runtime fact
  # the publisher derives from the signed ABI hash at publish time.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      relay: ${{ steps.filter.outputs.relay }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      guest: ${{ steps.filter.outputs.guest }}
      native_host: ${{ steps.filter.outputs.native_host }}
      native_cli: ${{ steps.filter.outputs.native_cli }}
      native_daemon: ${{ steps.filter.outputs.native_daemon }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A broken classifier must never produce output: its own contract tests
      # run in this job, before any classification is trusted.
      - name: The classifier must pass its own contract tests
        run: node --test scripts/ci-classify.test.mjs scripts/ci-native-fingerprint.test.mjs scripts/ci-wit-digest.test.mjs
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Tag / rehearsal release: pay for the whole matrix once, at the point
          # something is about to ship. main and PR stay on the path filter.
          if [ "${{ inputs.force_full }}" = "true" ]; then
            node scripts/ci-classify.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              node scripts/ci-classify.mjs --all >> "$GITHUB_OUTPUT"
              echo "no usable before SHA: full suite"
              exit 0
            fi
          fi

          git diff --name-only "$base" "$head" | tee /tmp/changed-files
          printf 'changed (%d)\n' "$(wc -l < /tmp/changed-files)"
          node scripts/ci-classify.mjs --stdin < /tmp/changed-files >> "$GITHUB_OUTPUT"

  # A lock file records where each tarball came from. Written on a machine with a
  # company mirror in its npm config, it records that mirror — and then every
  # install anywhere else fails, including the release build, which is where it
  # was found the first time. Cheap to check, expensive to discover late.
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every dependency must come from somewhere the world can reach
        run: |
          set -euo pipefail
          bad="$(grep -rhoE '"resolved": "https?://[^/"]+' --include=package-lock.json . \
            | sort -u | grep -v 'registry.npmjs.org' || true)"
          if [ -n "$bad" ]; then
            echo "these hosts are not the public registry:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "all resolved URLs point at the public registry"

      - name: Every third-party action must be pinned to a commit
        run: |
          set -euo pipefail
          # Local reusable workflows (`./.github/workflows/...`) are allowed;
          # everything else must be a third-party action pinned to a full SHA.
          bad="$(grep -rhoE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]#]+' \
            --include='*.yml' --include='*.yaml' .github/workflows \
            | sed -E 's/.*uses:[[:space:]]+//' \
            | grep -Ev '^(\./.+|[^@]+@[0-9a-f]{40})$' || true)"
          if [ -n "$bad" ]; then
            echo "these actions are not pinned to a full commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "all third-party actions are pinned to full commit SHAs"

      # Two modules whose paths differ only in casing are one module on Windows
      # and on a stock macOS disk. An import then resolves to whichever of them
      # the filesystem hands over, and the build fails only on those machines —
      # which is how `session/Timeline.tsx` beside `session/timeline.ts` got as
      # far as a release tag before anything complained.
      - name: No two source files may differ only in casing
        run: |
          set -euo pipefail
          bad="$(git ls-files '*.ts' '*.tsx' '*.rs' \
            | sed -E 's/\.(ts|tsx|rs)$//' \
            | tr 'A-Z' 'a-z' | sort | uniq -d || true)"
          if [ -n "$bad" ]; then
            echo "these paths collide on a case-insensitive filesystem:" >&2
            git ls-files '*.ts' '*.tsx' '*.rs' | grep -iE "^($(echo "$bad" | paste -sd'|'))\.(ts|tsx|rs)$" >&2
            exit 1
          fi
          echo "no path collides on a case-insensitive filesystem"

  # wasm32-wasip2 is the same bytes on every OS. Compile the guest once on
  # Linux and hand the artifact to rust / web / desktop. Windows and macOS
  # must not rustc this crate.
  guest:
    needs: changes
    if: needs.changes.outputs.guest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Compile the guest once on Linux
        run: cargo build --profile iterate -p genehub-guest --target wasm32-wasip2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-ci-guest
          path: target/wasm32-wasip2/iterate/genehub_guest.wasm
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: [changes, guest]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/agent-clis/package-lock.json
      # The adapter journeys (docs/testing.md §8.1's "专项测试") drive real
      # third-party CLIs. Without them the cases skip themselves; installing
      # costs nothing since the Claude Code one only actually runs when
      # JOURNEY_LLM=real. `claude` itself, not `claude-agent-acp`: the
      # daemon speaks its native stream-json protocol directly
      # (apps/daemon/src/adapter/claude.rs).
      # These are test fixtures, not product dependencies. Keep them in their
      # own lockfile so `npm ci` verifies exact tarball integrity without
      # coupling Rust CI to one of the shipped JavaScript packages. Codex uses
      # its native CLI now, so the retired codex-acp bridge is not installed.
      - name: Install locked third-party agent CLIs
        run: |
          npm ci --prefix .github/agent-clis
          echo "$GITHUB_WORKSPACE/.github/agent-clis/node_modules/.bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Journeys and the web job start these processes. A debug host is ~500MB
      # and runs Cranelift unoptimized (~6s to listening here). Iterate is the
      # product-shaped compile. Stage into target/debug because locators and
      # the artifact handoff still look there. `cargo test` only builds test
      # harnesses and may overwrite genet-local with a debug CLI; restage
      # after the tests so the web job does not get that image.
      - name: Reuse the Linux guest wasm
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: open-ci-guest
          path: target/wasm32-wasip2/iterate
      - name: Stage iterate CLI, host, agent, and guest
        run: |
          cargo build --profile iterate -p genet-cli -p genet-agent -p genehub-host
          mkdir -p target/debug
          test -f target/wasm32-wasip2/iterate/genehub_guest.wasm
          cp target/iterate/genet-local target/debug/genet-local
          cp target/iterate/genet-agent-local target/debug/genet-agent-local
          cp target/iterate/genehub-host-local target/debug/genehub-host-local
          cp target/wasm32-wasip2/iterate/genehub_guest.wasm target/debug/genehub_guest.wasm
      # Journeys default to the mock model, so this stays offline and free.
      #
      # The failure list is repeated as annotations because reading a job's log
      # needs admin rights on the repository: without this, a failure here says
      # only "exit code 101" to everyone else, including whoever is looking at a
      # red release tag. `--no-fail-fast` so one broken case does not hide the
      # rest.
      - name: Run the workspace tests
        run: |
          set -uo pipefail
          # The runner's shell already has `-e`, which would end this script at
          # the failing pipeline and skip the reporting below entirely.
          set +e
          cargo test --workspace --exclude genehub-testing --exclude genehub-host --no-fail-fast 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Indented single words in a `failures:` block are the case names.
            # Not `\S+::\S+`: integration test names have no module path.
            awk '/^failures:$/,0' /tmp/tests.log | grep -E '^ {4}\S+$' | sort -u | head -20 \
              | while IFS= read -r case; do echo "::error::failed:$case"; done
            # `-A1`, because a panic prints its location on one line and the
            # reason on the next. Without it a failure reads "panicked at
            # opencode.rs:81" and the sentence that says why — the only part
            # worth reading — is in a log nobody outside the repository can
            # open. That cost a round trip on a race we could have read in one.
            grep -E -A1 "^(thread|error|panicked at)" /tmp/tests.log | head -20 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
      - name: Restage iterate runtime after cargo test
        run: |
          cp target/iterate/genet-local target/debug/genet-local
          cp target/iterate/genet-agent-local target/debug/genet-agent-local
          cp target/iterate/genehub-host-local target/debug/genehub-host-local
      # The web job reuses these instead of compiling the same runtime again.
      # Retention is short: they are only a same-run handoff.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-ci-bins
          path: |
            target/debug/genet-local
            target/debug/genet-agent-local
            target/debug/genehub-host-local
            target/debug/genehub_guest.wasm
          if-no-files-found: error
          retention-days: 1

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Covers the boundary checks from architecture.md §6.4 and the digest that
      # keeps the contract from changing on one side only.
      - run: npm test
      # Built once here so the web job does not pay for another `npm ci` + build
      # when both jobs run on the same tip.
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-ci-relay-dist
          path: apps/relay/dist/
          if-no-files-found: error
          retention-days: 1

  web:
    needs: [changes, guest, rust, relay]
    # `always()` so a skipped rust/relay job does not cancel a web-only PR.
    # Still refuse to run when a dependency that did run has failed.
    if: >-
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.web == 'true'
      && (needs.guest.result == 'success' || needs.guest.result == 'skipped')
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
      && (needs.relay.result == 'success' || needs.relay.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GENET_E2E_REQUIRED: "1"
      GENET_E2E_DAEMON: ${{ github.workspace }}/target/debug/genet-local
      GENET_E2E_AGENT: ${{ github.workspace }}/target/debug/genet-agent-local
    defaults:
      run:
        working-directory: packages/workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/workbench/package-lock.json
            apps/relay/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: needs.rust.result != 'success'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: needs.rust.result != 'success'
      # Prefer the bins the rust job already produced. Rebuild only when that job
      # did not run (web-only / relay-only tip).
      # upload-artifact stores files relative to the paths' common ancestor. The
      # two binaries therefore arrive at the download root, which must be the
      # debug directory expected by the journeys.
      - name: Reuse daemon and agent bins from the rust job
        if: needs.rust.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: open-ci-bins
          path: target/debug
      - name: Reuse the Linux guest wasm
        if: needs.rust.result != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: open-ci-guest
          path: target/wasm32-wasip2/iterate
      - name: Build daemon and agent bins
        if: needs.rust.result != 'success'
        run: |
          cargo build --profile iterate -p genet-cli -p genet-agent -p genehub-host
          mkdir -p target/debug
          test -f target/wasm32-wasip2/iterate/genehub_guest.wasm
          cp target/iterate/genet-local target/debug/genet-local
          cp target/iterate/genet-agent-local target/debug/genet-agent-local
          cp target/iterate/genehub-host-local target/debug/genehub-host-local
          cp target/wasm32-wasip2/iterate/genehub_guest.wasm target/debug/genehub_guest.wasm
        working-directory: .
      - run: chmod +x target/debug/genet-local target/debug/genet-agent-local target/debug/genehub-host-local
        working-directory: .
      # The artifact contains compiled JavaScript, not its runtime packages.
      # Keep the cheap production-only install while avoiding relay dev
      # dependencies and a duplicate TypeScript build.
      - name: Install relay runtime dependencies
        if: needs.relay.result == 'success'
        run: npm ci --omit=dev
        working-directory: apps/relay
      - name: Reuse relay dist from the relay job
        if: needs.relay.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: open-ci-relay-dist
          path: apps/relay/dist
      # And the self-hosted case drives a real relay on top of that. This is
      # the job that proves the open repository stands on its own — a relay and
      # a folder of static files — so letting it skip would drop the claim.
      - name: Build relay
        if: needs.relay.result != 'success'
        run: npm ci && npm run build
        working-directory: apps/relay
      - run: npm ci
      - run: npm run typecheck
      - name: Refuse to skip mandatory real-process journeys
        run: |
          test -x "$GENET_E2E_DAEMON"
          test -x "$GENET_E2E_AGENT"
          test -x "$GITHUB_WORKSPACE/target/debug/genehub-host-local"
          test -f "$GITHUB_WORKSPACE/target/debug/genehub_guest.wasm"
          test -f "$GITHUB_WORKSPACE/apps/relay/dist/main.js"
      - run: npm test
      - run: npm run build

  desktop:
    needs: [changes, guest]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: rustc
        shell: bash
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - id: fp
        shell: bash
        run: node scripts/ci-native-fingerprint.mjs >> "$GITHUB_OUTPUT"
      # Restore the last iterate host/CLI built from this exact source tree.
      # A miss (or a hit that left no file) rebuilds. Save immediately after
      # rustc so a later test failure does not throw away a 10-minute compile.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: host-bin
        with:
          path: |
            target/iterate/genehub-host-local
            target/iterate/genehub-host-local.exe
          key: iterate-host-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.fp.outputs.host }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cli-bin
        with:
          path: |
            target/iterate/genet-local
            target/iterate/genet-local.exe
          key: iterate-cli-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.fp.outputs.cli }}
      # Daemon persistence is shared by the CLI and desktop shell. In
      # particular, the owner-only Windows DACL assertions must execute on a
      # real Windows filesystem; a Linux cross-check can only compile them.
      - if: needs.changes.outputs.native_daemon == 'true'
        run: cargo test -p genet-daemon --lib
      # The WASM guest delegates chmod-equivalent hardening to the native host.
      # Its Windows implementation must be exercised on NTFS, not merely
      # cross-compiled from Linux.
      - if: needs.changes.outputs.native_host == 'true'
        run: cargo test -p genehub-host --bin genehub-host-local fs_perms::tests
      - name: Build iterate host and CLI when the fingerprint misses
        if: steps.host-bin.outputs.cache-hit != 'true' || steps.cli-bin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pkgs=()
          if [ "${{ steps.host-bin.outputs.cache-hit }}" != "true" ]; then
            pkgs+=(-p genehub-host)
          fi
          if [ "${{ steps.cli-bin.outputs.cache-hit }}" != "true" ]; then
            pkgs+=(-p genet-cli)
          fi
          cargo build --profile iterate "${pkgs[@]}"
      - name: Remember the iterate host binary
        if: success() && steps.host-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/iterate/genehub-host-local
            target/iterate/genehub-host-local.exe
          key: iterate-host-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.fp.outputs.host }}
      - name: Remember the iterate CLI binary
        if: success() && steps.cli-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/iterate/genet-local
            target/iterate/genet-local.exe
          key: iterate-cli-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ steps.fp.outputs.cli }}
      - name: Reuse the Linux guest wasm
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: open-ci-guest
          path: target/wasm32-wasip2/iterate
      # Supervision launches the ordinary sibling pair. A debug host is ~500MB
      # and runs Cranelift unoptimized: on this Linux box that is 6s to
      # listening for the 13MB iterate guest; a Windows runner plus Defender
      # scanning that image is what blew the old 60s budget (CI #205). The
      # iterate profile is the product-shaped compile (opt-1, stripped, ~36MB,
      # <1s here). Stage it next to the guest so the tests keep looking in
      # target/debug. Guest bytes come from the Linux job; Win/mac never rustc
      # wasm32-wasip2.
      - name: Stage iterate CLI, host, and guest for supervision
        shell: bash
        run: |
          set -euo pipefail
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          if [ ! -x "target/iterate/genehub-host-local${exe}" ]; then
            echo "host cache claimed a hit but the binary is missing; rebuilding"
            cargo build --profile iterate -p genehub-host
          fi
          if [ ! -x "target/iterate/genet-local${exe}" ]; then
            echo "cli cache claimed a hit but the binary is missing; rebuilding"
            cargo build --profile iterate -p genet-cli
          fi
          test -f target/wasm32-wasip2/iterate/genehub_guest.wasm
          mkdir -p target/debug
          cp "target/iterate/genet-local${exe}" "target/debug/genet-local${exe}"
          cp "target/iterate/genehub-host-local${exe}" "target/debug/genehub-host-local${exe}"
          cp target/wasm32-wasip2/iterate/genehub_guest.wasm target/debug/genehub_guest.wasm
          cp target/wasm32-wasip2/iterate/genehub_guest.wasm target/iterate/genehub_guest.wasm
      - name: Refuse to skip real daemon supervision
        shell: bash
        run: |
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          test -x "target/debug/genet-local${exe}"
          test -x "target/debug/genehub-host-local${exe}"
          test -f target/debug/genehub_guest.wasm
          node scripts/ci-smoke-staged-daemon.mjs
        env:
          GENEHUB_TEST_COMPONENT_CACHE_DIR: ${{ github.workspace }}/target/test-component-cache
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      # The installer integrity gate is pure Rust but lives in the Tauri crate;
      # compile and execute it on the two desktop platforms we actually ship or
      # support, rather than treating a Linux WebView build as a proxy.
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test wiring
      - name: Restage iterate binaries after desktop cargo tests
        shell: bash
        run: |
          set -euo pipefail
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          cp "target/iterate/genet-local${exe}" "target/debug/genet-local${exe}"
          cp "target/iterate/genehub-host-local${exe}" "target/debug/genehub-host-local${exe}"
          cp target/wasm32-wasip2/iterate/genehub_guest.wasm target/debug/genehub_guest.wasm
      # All lifecycle cases run on both platforms. Only the test which kills a
      # listener behind the supervisor's back is Unix-specific.
      # These tests deliberately share process environment and each cold-start
      # a Wasmtime component. Running them concurrently races the environment
      # and can exhaust a hosted runner compiling several components at once.
      - name: Run desktop daemon supervision
        shell: bash
        env:
          GENEHUB_TEST_COMPONENT_CACHE_DIR: ${{ github.workspace }}/target/test-component-cache
        run: |
          set -uo pipefail
          set +e
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test supervision -- --test-threads=1 --nocapture 2>&1 | tee /tmp/supervision.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            awk '/^failures:$/,0' /tmp/supervision.log | grep -E '^ {4}\S+$' | sort -u | head -20 \
              | while IFS= read -r case; do echo "::error::failed:$case"; done
            grep -E -A2 "^(thread|error|panicked at|ABI_PAIRING_FAILED)" /tmp/supervision.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --test wiring --test supervision -- -D warnings

  # Single required check for branch protection. Skipped path-filtered jobs are
  # fine; a failed or cancelled job that was supposed to run is not.
  gate:
    needs: [changes, lockfiles, guest, rust, relay, web, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every scheduled job to pass
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          LOCKFILES: ${{ needs.lockfiles.result }}
          GUEST: ${{ needs.guest.result }}
          RUST: ${{ needs.rust.result }}
          RELAY: ${{ needs.relay.result }}
          WEB: ${{ needs.web.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WANT_GUEST: ${{ needs.changes.outputs.guest }}
          WANT_RUST: ${{ needs.changes.outputs.rust }}
          WANT_RELAY: ${{ needs.changes.outputs.relay }}
          WANT_WEB: ${{ needs.changes.outputs.web }}
          WANT_DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2" required="${3:-true}"
            if [ "$required" != "true" ]; then
              echo "ok: $name skipped (not selected)"
              return
            fi
            case "$result" in
              success) echo "ok: $name" ;;
              *)
                echo "::error::$name finished as $result"
                fail=1
                ;;
            esac
          }
          check changes "$CHANGES" true
          check lockfiles "$LOCKFILES" true
          check guest "$GUEST" "$WANT_GUEST"
          check rust "$RUST" "$WANT_RUST"
          check relay "$RELAY" "$WANT_RELAY"
          check web "$WEB" "$WANT_WEB"
          check desktop "$DESKTOP" "$WANT_DESKTOP"
          exit "$fail"
