name: Release

# Installers, on a tag. Built on each platform because there is no honest way to
# cross-build a Tauri bundle: the installer embeds the system WebView glue and
# the packaging tool of the platform it targets.
#
# This is only the App-installation path: native Platform, matching signed Wasm,
# CLI and shell move together. Web-only and same-ABI Wasm patches do not trigger
# this workflow. A plain tag archives Official on GitHub and mirrors it to the
# website; prerelease tags publish their artifacts only to their website channel.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand, so a release can be rehearsed without inventing a
  # tag for it. Nothing is published in that case, and the build is dev,
  # matching the tree.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full CI matrix (rust, relay, web e2e, desktop Win/mac). Ordinary main/PR
  # runs stay path-filtered; the tag is where every job has to pass together
  # before an installer or tarball is built.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      force_full: true

  # What this run is. Every later job reads the answers from here rather than
  # re-deriving them, so there is exactly one place where the tag's shape
  # becomes a channel.
  channel:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.detect.outputs.name }}
      asset_prefix: ${{ steps.detect.outputs.asset_prefix }}
      tarball_prefix: ${{ steps.detect.outputs.tarball_prefix }}
      manifest: ${{ steps.detect.outputs.manifest }}
      hub_url: ${{ steps.detect.outputs.hub_url }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      cloud_repository: ${{ steps.detect.outputs.cloud_repository }}
      cloud_sha: ${{ steps.detect.outputs.cloud_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require a tag to belong to the public main history
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          public="https://github.com/${GITHUB_REPOSITORY}.git"
          fetch_args=(--no-tags --filter=blob:none)
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            fetch_args+=(--unshallow)
          fi
          # Fetch the branch ref itself and immediately freeze the observed
          # object id. A moving branch name is never used after this point.
          git fetch "${fetch_args[@]}" "$public" refs/heads/main
          main_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          release_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" "$main_sha"; then
            echo "::error::release commit $release_sha is not in public main at $main_sha; refusing a tag cut from a feature or detached history"
            exit 1
          fi
          {
            echo "### Release ancestry"
            echo "- tag commit: \`$release_sha\`"
            echo "- public main snapshot: \`$main_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::release commit $release_sha is an ancestor of public main $main_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_HUB_URL: ${{ vars.GENEHUB_BETA_HUB_URL || 'https://relay-beta.genethub.com' }}
          ALPHA_HUB_URL: ${{ vars.GENEHUB_ALPHA_HUB_URL || 'https://relay-alpha.genethub.com' }}
          OFFICIAL_HUB_URL: ${{ vars.GENEHUB_HUB_URL || 'https://relay.genethub.com' }}
          CLOUD_REPOSITORY: ${{ vars.CLOUD_REPO || format('{0}/genethub-cloud', github.repository_owner) }}
        run: |
          set -euo pipefail
          # The tag's shape, and only that: `v1.2.3` is official,
          # `v1.3.0-beta.4` is beta, `v1.3.0-alpha.4` is alpha, and anything
          # else is not a release — refused here rather than published under a
          # guessed channel.
          tag="${GITHUB_REF_NAME:-}"
          if [[ "$tag" == v* ]]; then
            case "$tag" in
              v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*)  want=beta ;;
              v[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*) want=alpha ;;
              v[0-9]*.[0-9]*.[0-9]*)              want=official ;;
              *) echo "::error::'$tag' is neither vX.Y.Z nor vX.Y.Z-beta.N nor vX.Y.Z-alpha.N — no such release"; exit 1 ;;
            esac
          fi
          channel="$(node scripts/channel.mjs --detect)"
          if [[ "$tag" == v* && "${want:-}" != "$channel" ]]; then
            echo "::error::tag says ${want:-?} but scripts/channel.mjs says $channel — the two rules drifted"
            exit 1
          fi

          if [[ ! "$CLOUD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::CLOUD_REPO must be an owner/repository name"
            exit 1
          fi
          cloud_ref="$(git ls-remote --exit-code --refs \
            "https://github.com/$CLOUD_REPOSITORY.git" refs/heads/main)"
          read -r cloud_sha advertised extra <<<"$cloud_ref"
          if [[ ! "$cloud_sha" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$advertised" != refs/heads/main ] \
            || [ -n "${extra:-}" ]; then
            echo "::error::could not resolve one immutable Cloud main commit"
            exit 1
          fi

          # Number discipline the checklist cannot enforce: once a minor has
          # shipped officially, a prerelease of that same minor is an update
          # that is older than what its testers already run. Prereleases of
          # either line live strictly on the next minor.
          if [[ "$channel" == beta || "$channel" == alpha ]] && [[ "$tag" == v* ]]; then
            latest_official="$(gh release view --json tagName -q .tagName || true)"
            if [ -n "$latest_official" ]; then
              pre_minor="$(sed 's/^v[0-9]*\.\([0-9]*\)\..*/\1/' <<<"$tag")"
              official_minor="$(sed 's/^v[0-9]*\.\([0-9]*\)\..*/\1/' <<<"$latest_official")"
              if [ "$pre_minor" -le "$official_minor" ]; then
                echo "::error::$tag is a $channel of minor $pre_minor, but $latest_official already shipped — prereleases start at 0.$((official_minor + 1)).0-$channel.1"
                exit 1
              fi
            fi
          fi

          {
            echo "name=$channel"
            case "$channel" in
              beta)
                echo "asset_prefix=GeneHub-beta"
                echo "tarball_prefix=genet-beta"
                echo "manifest=latest-beta.json"
                hub_url="$BETA_HUB_URL"
                echo "prerelease=true"
                ;;
              alpha)
                echo "asset_prefix=GeneHub-alpha"
                echo "tarball_prefix=genet-alpha"
                echo "manifest=latest-alpha.json"
                # Alpha is the intranet line: the default is only a placeholder,
                # a real deployment sets the variable to its own address.
                hub_url="$ALPHA_HUB_URL"
                echo "prerelease=true"
                ;;
              official)
                echo "asset_prefix=GeneHub"
                echo "tarball_prefix=genet"
                echo "manifest=latest.json"
                hub_url="$OFFICIAL_HUB_URL"
                echo "prerelease=false"
                ;;
              *)
                # dev: a rehearsal. Nothing is published (the publish job only
                # runs on a tag), so the names only have to be honest.
                echo "asset_prefix=GeneHub-dev"
                echo "tarball_prefix=genet-dev"
                echo "manifest=latest-dev.json"
                hub_url=
                echo "prerelease=true"
                ;;
            esac
            if [ -n "$hub_url" ]; then
              HUB_URL="$hub_url" node -e '
                const raw = process.env.HUB_URL ?? "";
                if (/[\u0000-\u001f\u007f]/u.test(raw)) throw new Error("Hub URL contains control characters");
                const parsed = new URL(raw);
                if (parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.search || parsed.hash) {
                  throw new Error("published Hub URL must be HTTPS and contain no credentials, query, or fragment");
                }
              '
            fi
            printf 'hub_url=%s\n' "$hub_url"
            printf 'cloud_repository=%s\n' "$CLOUD_REPOSITORY"
            printf 'cloud_sha=%s\n' "$cloud_sha"
          } >> "$GITHUB_OUTPUT"

  # The portable application is built once on Linux and signed once. Every
  # native package below downloads this exact file; no Windows/macOS compiler
  # participates in logic publication.
  daemon_logic:
    needs: [channel, verify]
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.logic.outputs.revision }}
      promoted_from_beta: ${{ steps.logic.outputs.promoted_from_beta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-daemon-logic
      - name: Build and sign the one cross-platform logic artifact
        id: logic
        shell: bash
        env:
          CHANNEL: ${{ needs.channel.outputs.name }}
          HUB_URL: ${{ needs.channel.outputs.hub_url }}
          BETA_SIGNING_KEY: ${{ secrets.GENEHUB_BETA_LOGIC_SIGNING_KEY }}
          BETA_KEY_ID: ${{ vars.GENEHUB_BETA_LOGIC_KEY_ID }}
          ALPHA_SIGNING_KEY: ${{ secrets.GENEHUB_ALPHA_LOGIC_SIGNING_KEY }}
          ALPHA_KEY_ID: ${{ vars.GENEHUB_ALPHA_LOGIC_KEY_ID }}
          OFFICIAL_SIGNING_KEY: ${{ secrets.GENEHUB_OFFICIAL_LOGIC_SIGNING_KEY }}
          OFFICIAL_KEY_ID: ${{ vars.GENEHUB_OFFICIAL_LOGIC_KEY_ID }}
          BETA_HUB_URL: ${{ vars.GENEHUB_BETA_HUB_URL || 'https://relay-beta.genethub.com' }}
          UNPROMOTED_OFFICIAL: ${{ vars.GENEHUB_UNPROMOTED_OFFICIAL_REASON }}
        run: |
          set -euo pipefail
          node scripts/version.mjs --from-tag
          node scripts/channel.mjs --from-tag
          cargo build -p genet-daemon-logic \
            --target wasm32-wasip1 \
            --profile daemon-logic-release
          mkdir -p dist
          raw=target/wasm32-wasip1/daemon-logic-release/genet_daemon_logic.wasm
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            case "$CHANNEL" in
              beta) signing_key="$BETA_SIGNING_KEY"; key_id="$BETA_KEY_ID"; manifest=latest-beta.json ;;
              alpha) signing_key="$ALPHA_SIGNING_KEY"; key_id="$ALPHA_KEY_ID"; manifest=latest-alpha.json ;;
              official) signing_key="$OFFICIAL_SIGNING_KEY"; key_id="$OFFICIAL_KEY_ID"; manifest=latest.json ;;
              *) echo "::error::tag build has non-release channel $CHANNEL"; exit 1 ;;
            esac
            test -n "$signing_key" || {
              echo "::error::$CHANNEL logic signing key is required for an App release"
              exit 1
            }
            [[ "$key_id" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
              echo "::error::$CHANNEL logic key id must be a safe non-empty identifier"
              exit 1
            }
            revision="$(CHANNEL="$CHANNEL" MANIFEST_URL="$HUB_URL/artifacts/manifests/logic/$manifest" node --input-type=module -e '
              const response = await fetch(process.env.MANIFEST_URL, {
                cache: "no-store",
                redirect: "error",
                signal: AbortSignal.timeout(30_000),
              });
              let current = 0;
              if (response.status !== 404) {
                if (!response.ok) throw new Error(`logic manifest returned ${response.status}`);
                const body = await response.json();
                if (body.schema !== "genehub.logic-manifest.v1" || body.channel !== process.env.CHANNEL ||
                    !Number.isSafeInteger(body.logicRevision) || body.logicRevision <= 0) {
                  throw new Error("current logic manifest has an invalid identity");
                }
                current = body.logicRevision;
              }
              // Sparse future revisions let a long cross-platform App build coexist
              // with same-ABI logic patches without reserving mutable publication state.
              process.stdout.write(String(Math.max(current + 1, Date.now())));
            ')"
            export GENET_DAEMON_LOGIC_SIGNING_KEY="$signing_key"
            cargo run --quiet -p genet-daemon-artifact -- \
              pack "$raw" dist/daemon-logic.wasm "$CHANNEL" "$revision" "$key_id"
            public_key="$(cargo run --quiet -p genet-daemon-artifact -- public-key)"
          else
            cargo run --quiet -p genet-daemon-artifact -- \
              pack-dev "$raw" dist/daemon-logic.wasm 1
            public_key="$(cargo run --quiet -p genet-daemon-artifact -- dev-public-key)"
            key_id=dev-local
            revision=1
          fi
          cargo run --quiet -p genet-daemon-artifact -- inspect \
            dist/daemon-logic.wasm > dist/logic-identity.json
          REVISION="$revision" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const identity = JSON.parse(readFileSync("dist/logic-identity.json", "utf8"));
            if (identity.logicRevision !== Number(process.env.REVISION)) throw new Error("signed revision drifted");
          '
          promoted_from_beta=
          if [ "$CHANNEL" = official ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if promoted_from_beta="$(node scripts/beta-promotion.mjs \
              --app "$BETA_HUB_URL/artifacts/manifests/app/latest-beta.json" \
              --logic "$BETA_HUB_URL/artifacts/manifests/logic/latest-beta.json" \
              --identity dist/logic-identity.json \
              --open-sha "$GITHUB_SHA" \
              --release "${GITHUB_REF_NAME#v}")"; then
              echo "::notice::Official is promoted from $promoted_from_beta"
            else
              prefix="$GITHUB_REF_NAME:"
              if [[ "$UNPROMOTED_OFFICIAL" != "$prefix"* ]]; then
                echo "::error::Official must match the current Beta App and Logic. An emergency exception must be tag-bound as '$prefix<reason>'."
                exit 1
              fi
              reason="${UNPROMOTED_OFFICIAL#"$prefix"}"
              REASON="$reason" node -e '
                const value = process.env.REASON ?? "";
                if (value.length < 8 || value.length > 160 || /[\u0000-\u001f\u007f]/u.test(value)) {
                  throw new Error("emergency release reason must be 8..160 printable characters");
                }
              '
              promoted_from_beta="emergency:$GITHUB_REF_NAME:$reason"
              echo "::warning::using the tag-bound unpromoted Official exception: $reason"
            fi
          fi
          {
            printf 'GENET_DAEMON_LOGIC_KEY_ID=%s\n' "$key_id"
            printf 'GENET_DAEMON_LOGIC_PUBLIC_KEY=%s\n' "$public_key"
          } > dist/trust.env
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'promoted_from_beta=%s\n' "$promoted_from_beta" >> "$GITHUB_OUTPUT"
          test "$(od -An -tx1 -N4 dist/daemon-logic.wasm | tr -d ' \n')" = 0061736d
          sha256sum dist/daemon-logic.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-logic-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Windows is the only platform that gets an installer in this version.
  #
  # Linux gets the pair of binaries below instead: a Linux box is usually reached
  # over SSH, where a windowed app is no use, and where it has a graphical
  # session the workbench opens in the browser the machine already has. That
  # leaves the desktop shell doing nothing there that is worth a WebView
  # dependency. macOS waits for signing and notarisation, without which the
  # download is a security warning with an app behind it.
  installers:
    needs: [channel, verify, daemon_logic]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            bundles: nsis
            pattern: "*-setup.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot, verified 2026-08-04
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-logic-release
          path: ${{ runner.temp }}/daemon-logic

      - run: npm ci
        working-directory: apps/desktop

      # The version this release ships, taken from the tag and written into the
      # three files that have to carry one, and the channel, written into
      # everything that names a process, a directory or an override. The tree
      # itself says 0.0.0 and dev — no human edits either: `scripts/version.mjs`
      # and `scripts/channel.mjs` explain why, and hold the whole rule so that
      # no workflow has to repeat it.
      - run: |
          node scripts/version.mjs --from-tag
          node scripts/channel.mjs --from-tag
        shell: bash

      # Stages the daemon and the built-in agent into the supported platform's
      # bundle. Linux ships the separate daemon/CLI tarball below, never a
      # desktop package.
      # The error lines are repeated as annotations because reading a job's log
      # needs admin rights on the repository, and a Windows-only failure cannot
      # be reproduced on the machine this is developed on. Without it, a red
      # release says only "exit code 1".
      - name: Build the installer
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          GENET_DAEMON_LOGIC_WASM: ${{ runner.temp }}/daemon-logic/daemon-logic.wasm
        run: |
          set -uo pipefail
          set -a
          . "${{ runner.temp }}/daemon-logic/trust.env"
          set +a
          # The runner's shell already has `-e`, which would end this script at
          # the failing pipeline and skip the reporting below entirely.
          set +e
          node apps/desktop/scripts/bundle.mjs 2>&1 | tee /tmp/bundle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "^(error|failed|thread .* panicked)|error\[|error:" /tmp/bundle.log \
              | tail -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          cmp "${{ runner.temp }}/daemon-logic/daemon-logic.wasm" \
            apps/desktop/src-tauri/bin/daemon-logic.wasm || {
              echo "::error::desktop bundle did not embed the signed logic artifact byte-for-byte"
              exit 1
            }

      # An upgrade has to stop what it is about to overwrite, and a `taskkill` on
      # a name nothing is called stops nothing — silently, with the same "Error
      # opening file for writing" at the other end. v0.1.7 killed `GeneHub.exe`,
      # the name in the Start menu, while the process is `genethub-desktop.exe`.
      # Only the build knows which is which, so it is asked here rather than
      # assumed in a comment.
      #
      # The names live in `!define` lines now, because the channel decides them
      # and the channels install side by side: a prerelease installer must stop
      # prerelease processes and leave the official line alone, and the defines
      # are what `scripts/channel.mjs` stamps. The stamp is checked both ways —
      # every non-official name carries its channel's suffix, official names
      # never do — because a half-stamped tree is exactly how one channel's
      # installer learns to kill another's daemon.
      - name: The installer stops processes that exist, and only this channel's
        shell: bash
        run: |
          set -euo pipefail
          names="$(grep -oE '^!define GH_[A-Z]+_EXE "[^"]+"' apps/desktop/src-tauri/installer.nsh \
            | sed 's/.*"\(.*\)"/\1/')"
          test -n "$names" || { echo "::error::the installer hook stops nothing"; exit 1; }
          # The daemon is the same `genet` binary every client runs, so it is
          # stopped by the pid in its lock file — never by image name, which
          # would kill CLI clients with it (`genethub-cli.md` §2).
          grep -q 'taskkill /F /T /PID' apps/desktop/src-tauri/installer.nsh             || { echo "::error::the installer no longer stops the daemon by its lock-file pid"; exit 1; }
          grep -q 'daemon.lock' apps/desktop/src-tauri/installer.nsh             || { echo "::error::the installer does not read the daemon's lock file"; exit 1; }
          # The shell-supervised daemon's lock sits under the bundle identifier
          # (Tauri `app_data_dir`), not the plain data dir — reading only the
          # latter was the upgrade that could not stop its own daemon.
          grep -q 'APPDATA\\${GH_BUNDLE_ID}\\${GH_DATA_DIR_NAME}\\daemon.lock' apps/desktop/src-tauri/installer.nsh             || { echo "::error::the installer does not read the shell-supervised daemon's lock"; exit 1; }
          ! grep -q 'IM genet' apps/desktop/src-tauri/installer.nsh             || { echo "::error::the installer kills genet by image name — that takes CLI clients down with the daemon"; exit 1; }
          # The vendored NSIS template exists to make upgrades default to
          # installing over the top; if the override is gone the template is
          # either unsynced or the config no longer points at it.
          grep -q '; GH:' apps/desktop/src-tauri/installer.nsi             || { echo "::error::the vendored installer.nsi lost the overwrite-by-default override"; exit 1; }
          grep -q '"template": "installer.nsi"' apps/desktop/src-tauri/tauri.conf.json             || { echo "::error::tauri.conf.json no longer builds from the vendored installer.nsi"; exit 1; }
          channel="$(node scripts/channel.mjs --show)"
          for name in $names; do
            found="$(find apps/desktop/src-tauri/target/release target/release \
              -maxdepth 1 -name "$name" -print -quit 2>/dev/null || true)"
            test -n "$found" || {
              echo "::error::installer.nsh stops '$name', but no executable of that name is built"
              exit 1
            }
            case "$channel:$name" in
              beta:*-beta.exe | alpha:*-alpha.exe | dev:*-dev.exe) ;;
              official:*)
                case "$name" in
                  *-beta.exe | *-alpha.exe | *-dev.exe)
                    echo "::error::official build ships a marked process name '$name' — a half-stamped tree"
                    exit 1
                    ;;
                esac
                ;;
              *) echo "::error::$channel build ships an unmarked process name '$name' — it would fight the other lines"
                exit 1 ;;
            esac
            echo "ok: $name -> $found"
          done

      # Prove the binary that went into the installer runs on this platform at
      # all — a release that ships a daemon which cannot start is the failure
      # nobody notices until a user hits it (`docs/roadmap.md` MVP 验收清单).
      - name: Smoke the daemon on this platform
        shell: bash
        env:
          GENET_DAEMON_LOGIC_WASM: ${{ runner.temp }}/daemon-logic/daemon-logic.wasm
        run: |
          set -uo pipefail
          . scripts/channel.env
          root="$(mktemp -d)"
          exe=""
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe"
          # And that it is the build this release claims to be. Without this, a
          # job that lost its stamping step would ship a daemon calling itself
          # 0.0.0 — which tells every user they run an unreleased build, silently.
          node scripts/version.mjs --verify "target/release/$CLI_BINARY$exe" || exit 1
          test -f "apps/desktop/src-tauri/bin/daemon-logic.wasm" || {
            echo "FAIL: installer resources lost daemon-logic.wasm" >&2
            exit 1
          }
          cmp "$GENET_DAEMON_LOGIC_WASM" apps/desktop/src-tauri/bin/daemon-logic.wasm || {
            echo "FAIL: installer resource is not the signed release logic artifact" >&2
            exit 1
          }
          env "$ENV_DATA_DIR=$root/data" "$ENV_WORKSPACE_DIR=$root/workspace" \
            "target/release/$CLI_BINARY$exe" daemon run >"$root/out.json" 2>"$root/err.log" &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q '"event":"listening"' "$root/out.json" && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if ! grep -q '"event":"listening"' "$root/out.json"; then
            echo "FAIL: the daemon did not come up on ${{ matrix.platform }}" >&2
            cat "$root/err.log" >&2
            exit 1
          fi
          test -d "$root/workspace" \
            || { echo "FAIL: no folder to work in was created" >&2; exit 1; }
          echo "the daemon starts on ${{ matrix.platform }} and prepares a workspace"

      # Two names for one file, on purpose:
      #
      # Official keeps a version-free GitHub convenience name. Every website
      # manifest points at the immutable versioned name; prereleases never use a
      # rolling GitHub release.
      #
      # The versioned one is what a person downloads. A browser that has seen
      # `GeneHub-windows-x64-setup.exe` before saves the next one as `(1)`, and
      # then nobody — including whoever is debugging with them — can tell which
      # version is in which file.
      - name: Name the artifact, twice
        shell: bash
        env:
          ASSET_PREFIX: ${{ needs.channel.outputs.asset_prefix }}
        run: |
          set -euo pipefail
          found="$(find apps/desktop/src-tauri/target/release/bundle -name '${{ matrix.pattern }}' -print -quit)"
          test -n "$found" || { echo "no installer matched ${{ matrix.pattern }}" >&2; exit 1; }
          mkdir -p dist
          asset="$ASSET_PREFIX-windows-x64-setup.exe"
          cp "$found" "dist/$asset"
          bytes="$(wc -c < "dist/$asset")"
          test "$bytes" -le 80000000 || {
            echo "::error::Windows installer is ${bytes} bytes; the desktop download budget is 80MB"
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          # Official `0.22.2` and prerelease `0.23.0-beta.4` / `0.23.0-alpha.1`
          # both get a second, versioned name. The old `*[!0-9.]*` guard treated
          # every `-beta.N` as "not a version" and skipped the copy, so the
          # site's manifest pointed at a file the release never uploaded.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            cp "$found" "dist/$ASSET_PREFIX-$version-windows-x64-setup.exe"
          else
            echo "no version in '$GITHUB_REF_NAME', keeping one name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-setup
          path: dist/*

  # The pair `scripts/install.sh` downloads, and the whole of what Linux gets in
  # this version. Names here have to match what that script asks for.
  #
  # Built for musl and linked statically so a box with an older glibc (CentOS 7,
  # Ubuntu 20.04, many cloud images) can still run the download. A dynamic build
  # on ubuntu-22.04 was requiring GLIBC_2.34 and failing on those machines with
  # a wall of `version 'GLIBC_…' not found` — exactly what `curl | sh` users hit.
  binaries:
    needs: [channel, verify, daemon_logic]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot, verified 2026-08-04
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-logic-release
          path: ${{ runner.temp }}/daemon-logic
      # As in the installer job: the tag is where the version and the channel
      # come from.
      - run: |
          node scripts/version.mjs --from-tag
          node scripts/channel.mjs --from-tag
        shell: bash
      - name: Build native binaries with the artifact's pinned public key
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "${{ runner.temp }}/daemon-logic/trust.env"
          set +a
          cargo build --release -p genet-cli -p genet-agent --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        env:
          TARBALL_PREFIX: ${{ needs.channel.outputs.tarball_prefix }}
        run: |
          set -euo pipefail
          . scripts/channel.env
          mkdir -p dist
          cp "${{ runner.temp }}/daemon-logic/daemon-logic.wasm" \
            "target/${{ matrix.target }}/release/daemon-logic.wasm"
          tar -czf "dist/$TARBALL_PREFIX-linux-x64.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            "$CLI_BINARY" "$AGENT_BINARY" daemon-logic.wasm
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            cp "dist/$TARBALL_PREFIX-linux-x64.tar.gz" \
              "dist/$TARBALL_PREFIX-$version-linux-x64.tar.gz"
          fi
          ls -la dist
      # What the tarball promises: two binaries that start on a machine with no
      # graphical session and nothing else installed — including no particular
      # glibc. `ldd` saying "not a dynamic executable" is the claim; starting is
      # the proof.
      - name: Check the binaries in the tarball start on their own
        shell: bash
        env:
          TARBALL_PREFIX: ${{ needs.channel.outputs.tarball_prefix }}
        run: |
          set -euo pipefail
          . scripts/channel.env
          root="$(mktemp -d)"
          tar -xzf "dist/$TARBALL_PREFIX-linux-x64.tar.gz" -C "$root"
          cmp "${{ runner.temp }}/daemon-logic/daemon-logic.wasm" "$root/daemon-logic.wasm" || {
            echo "FAIL: Linux installation does not contain the signed release logic artifact" >&2
            exit 1
          }
          # The unpacked copy, so this is a claim about what is in the tarball
          # rather than about what was left in the build directory.
          node scripts/version.mjs --verify "$root/$CLI_BINARY"
          # Static-pie prints "statically linked" and exits 0; a fully static
          # binary may exit 1 with "not a dynamic executable". Either is fine.
          # What is not fine is a list of .so dependencies on the host glibc.
          ldd "$root/$CLI_BINARY" >/tmp/ldd.out 2>&1 || true
          if grep -qiE 'not a dynamic|statically linked' /tmp/ldd.out; then
            echo "$CLI_BINARY is statically linked"
          else
            echo "FAIL: $CLI_BINARY is dynamically linked; old glibc hosts will break:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi
          env "$ENV_DATA_DIR=$root/data" "$ENV_WORKSPACE_DIR=$root/workspace" \
            timeout 30 "$root/$CLI_BINARY" daemon run >"$root/out.json" 2>"$root/err.log" || true
          grep -q '"event":"listening"' "$root/out.json" || {
            echo "FAIL: the packed daemon did not come up" >&2
            cat "$root/err.log" >&2
            exit 1
          }
          test -d "$root/workspace" \
            || { echo "FAIL: no folder to work in was created" >&2; exit 1; }
          echo "the packed daemon is static, starts, and prepares a folder to work in"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tarball
          path: dist/*

  # Only Official is archived on GitHub. No prerelease job has write access to
  # repository contents and there is no rolling beta/alpha release.
  publish_official_github:
    needs: [channel, daemon_logic, installers, binaries]
    if: startsWith(github.ref, 'refs/tags/v') && needs.channel.outputs.name == 'official'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-setup
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-tarball
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-logic-release
          path: logic
      - name: Record exact Official bytes
        run: |
          set -euo pipefail
          cp logic/daemon-logic.wasm dist/daemon-logic.wasm
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: false
          generate_release_notes: true

  # Beta/Alpha App tags are uncommon native releases. They publish only to the
  # website store on its dedicated least-privilege runner.
  publish_fast_website:
    needs: [channel, daemon_logic, installers, binaries]
    if: startsWith(github.ref, 'refs/tags/v') && needs.channel.outputs.name != 'official'
    runs-on: [self-hosted, linux, genehub-publisher]
    concurrency:
      group: genehub-app-${{ needs.channel.outputs.name }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      BETA_STAGE: ${{ vars.GENEHUB_BETA_STAGE }}
      ALPHA_STAGE: ${{ vars.GENEHUB_ALPHA_STAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: genethub
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ needs.channel.outputs.cloud_repository }}
          ref: ${{ needs.channel.outputs.cloud_sha }}
          token: ${{ secrets.GENEHUB_CLOUD_READ_TOKEN }}
          path: genethub-cloud
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-setup
          path: release-input/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-tarball
          path: release-input/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-logic-release
          path: release-input/logic
      - name: Publish website-only App and matching logic manifests
        env:
          RELEASE_CHANNEL: ${{ needs.channel.outputs.name }}
          RELEASE_ORIGIN: ${{ needs.channel.outputs.hub_url }}
          CLOUD_SHA: ${{ needs.channel.outputs.cloud_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            beta) release_stage="$BETA_STAGE" ;;
            alpha) release_stage="$ALPHA_STAGE" ;;
            *) echo "unexpected fast channel $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          CHANNEL="$RELEASE_CHANNEL" RELEASE="${GITHUB_REF_NAME#v}" \
          STAGE="$release_stage" PUBLIC_ORIGIN="$RELEASE_ORIGIN" \
          OPEN_ROOT="$GITHUB_WORKSPACE/genethub" CLOUD_ROOT="$GITHUB_WORKSPACE/genethub-cloud" \
          INPUT_ROOT="$GITHUB_WORKSPACE/release-input" OPEN_SHA="$GITHUB_SHA" CLOUD_SHA="$CLOUD_SHA" \
            "$GITHUB_WORKSPACE/genethub-cloud/deploy/publish-app-release.sh"

  # Official website publication runs only after GitHub has the exact bytes;
  # the publisher reads both back before moving either manifest.
  publish_official_website:
    needs: [channel, daemon_logic, installers, binaries, publish_official_github]
    if: startsWith(github.ref, 'refs/tags/v') && needs.channel.outputs.name == 'official'
    runs-on: [self-hosted, linux, genehub-publisher]
    concurrency:
      group: genehub-app-official
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      OFFICIAL_STAGE: ${{ vars.GENEHUB_OFFICIAL_STAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: genethub
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ needs.channel.outputs.cloud_repository }}
          ref: ${{ needs.channel.outputs.cloud_sha }}
          token: ${{ secrets.GENEHUB_CLOUD_READ_TOKEN }}
          path: genethub-cloud
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-setup
          path: release-input/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-tarball
          path: release-input/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon-logic-release
          path: release-input/logic
      - name: Mirror Official and activate App before its new-ABI logic
        env:
          RELEASE_ORIGIN: ${{ needs.channel.outputs.hub_url }}
          CLOUD_SHA: ${{ needs.channel.outputs.cloud_sha }}
          PROMOTED_FROM_BETA: ${{ needs.daemon_logic.outputs.promoted_from_beta }}
        run: |
          set -euo pipefail
          CHANNEL=official RELEASE="${GITHUB_REF_NAME#v}" \
          STAGE="$OFFICIAL_STAGE" PUBLIC_ORIGIN="$RELEASE_ORIGIN" \
          OPEN_ROOT="$GITHUB_WORKSPACE/genethub" CLOUD_ROOT="$GITHUB_WORKSPACE/genethub-cloud" \
          INPUT_ROOT="$GITHUB_WORKSPACE/release-input" OPEN_SHA="$GITHUB_SHA" CLOUD_SHA="$CLOUD_SHA" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_TAG="$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/genethub-cloud/deploy/publish-app-release.sh"
