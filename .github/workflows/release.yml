name: Release

# Installers, on a tag. Built on each platform because there is no honest way to
# cross-build a Tauri bundle: the installer embeds the system WebView glue and
# the packaging tool of the platform it targets.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand, so a release can be rehearsed without inventing a tag
  # for it. Nothing is published in that case.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundles: deb
            # Renamed to a name that does not carry the version, so the download
            # link can stay `releases/latest/download/<name>` forever instead of
            # being rewritten on every release.
            asset: GeneHub-linux-x64.deb
            pattern: "*.deb"
          - os: macos-14
            platform: macos
            bundles: dmg
            asset: GeneHub-macos-arm64.dmg
            pattern: "*.dmg"
          - os: macos-13
            platform: macos-intel
            bundles: dmg
            asset: GeneHub-macos-x64.dmg
            pattern: "*.dmg"
          - os: windows-2022
            platform: windows
            bundles: nsis
            asset: GeneHub-windows-x64-setup.exe
            pattern: "*-setup.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Linux WebView and tray dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
        working-directory: packages/web
      - run: npm ci
        working-directory: apps/desktop

      # Stages the daemon and the built-in agent into the bundle, then checks the
      # two promises the installer has to keep — no Node runtime inside, and the
      # packaged daemon actually starts (`docs/desktop-client.md` §4.1). The
      # checks only run where the tooling exists, which today is Linux.
      - name: Build the installer
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: ./apps/desktop/scripts/bundle.sh

      # `bundle.sh` unpacks the package and starts the daemon inside it, but the
      # tooling for that only exists on Linux. Everywhere else at least prove the
      # binary that went into the installer runs on this platform at all — a
      # release that ships a daemon which cannot start is the failure nobody
      # notices until a user hits it (`docs/roadmap.md` MVP 验收清单).
      - name: Smoke the daemon on this platform
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          set -uo pipefail
          root="$(mktemp -d)"
          exe=""
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe"
          GENEHUB_DATA_DIR="$root/data" GENEHUB_WORKSPACE_DIR="$root/workspace" \
            "target/release/genet-daemon$exe" >"$root/out.json" 2>"$root/err.log" &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q '"event":"listening"' "$root/out.json" && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if ! grep -q '"event":"listening"' "$root/out.json"; then
            echo "FAIL: the daemon did not come up on ${{ matrix.platform }}" >&2
            cat "$root/err.log" >&2
            exit 1
          fi
          test -d "$root/workspace" \
            || { echo "FAIL: no folder to work in was created" >&2; exit 1; }
          echo "the daemon starts on ${{ matrix.platform }} and prepares a workspace"

      - name: Give the artifact a stable name
        shell: bash
        run: |
          set -euo pipefail
          found="$(find apps/desktop/src-tauri/target/release/bundle -name '${{ matrix.pattern }}' -print -quit)"
          test -n "$found" || { echo "no installer matched ${{ matrix.pattern }}" >&2; exit 1; }
          mkdir -p dist
          cp "$found" "dist/${{ matrix.asset }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # The headless pair, for machines with no graphical session — and the fallback
  # `scripts/install.sh` downloads when nobody publishes an installer for a
  # platform. Names here have to match what that script asks for.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: genet-linux-x64.tar.gz
          - os: macos-14
            asset: genet-macos-arm64.tar.gz
          - os: macos-13
            asset: genet-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p genet-daemon -p genet-agent
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C target/release genet-daemon genet-agent
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: [installers, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # Checksums, because a download that arrives corrupted should be provable
      # rather than argued about.
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
