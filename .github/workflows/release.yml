name: Release

# Installers, on a tag. Built on each platform because there is no honest way to
# cross-build a Tauri bundle: the installer embeds the system WebView glue and
# the packaging tool of the platform it targets.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand, so a release can be rehearsed without inventing a tag
  # for it. Nothing is published in that case.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows is the only platform that gets an installer in this version.
  #
  # Linux gets the pair of binaries below instead: a Linux box is usually reached
  # over SSH, where a windowed app is no use, and where it has a graphical
  # session the workbench opens in the browser the machine already has. That
  # leaves the desktop shell doing nothing there that is worth a WebView
  # dependency. macOS waits for signing and notarisation, without which the
  # download is a security warning with an app behind it.
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            bundles: nsis
            # A name without the version in it, so the download link can stay
            # `releases/latest/download/<name>` forever instead of being
            # rewritten on every release.
            asset: GeneHub-windows-x64-setup.exe
            pattern: "*-setup.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: packages/web
      - run: npm ci
        working-directory: apps/desktop

      # The version this release ships, taken from the tag and written into the
      # three files that have to carry one. The tree itself says 0.0.0 and no
      # human ever edits a version — `scripts/version.sh` explains why, and holds
      # the whole rule so that no workflow has to repeat it.
      - run: ./scripts/version.sh --from-tag
        shell: bash

      # Stages the daemon and the built-in agent into the bundle. The checks on
      # what ends up inside it need `dpkg-deb`, so they live in the Linux job
      # below rather than here.
      # The error lines are repeated as annotations because reading a job's log
      # needs admin rights on the repository, and a Windows-only failure cannot
      # be reproduced on the machine this is developed on. Without it, a red
      # release says only "exit code 1".
      - name: Build the installer
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          # The Hub this build suggests. Only published builds get one: a copy
          # someone compiles from this repository has no business defaulting to
          # somebody else's service, and the field stays empty there.
          #
          # Without it, a first run asks the person to type an address they have
          # no way of knowing, and "先体验" — the one click that is supposed to
          # make a phone able to reach this machine — cannot even be pressed.
          VITE_GENEHUB_HUB_URL: ${{ vars.GENEHUB_HUB_URL || 'https://relay.genethub.com' }}
        run: |
          set -uo pipefail
          # The runner's shell already has `-e`, which would end this script at
          # the failing pipeline and skip the reporting below entirely.
          set +e
          ./apps/desktop/scripts/bundle.sh 2>&1 | tee /tmp/bundle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -iE "^(error|failed|thread .* panicked)|error\[|error:" /tmp/bundle.log \
              | tail -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      # An upgrade has to stop what it is about to overwrite, and a `taskkill` on
      # a name nothing is called stops nothing — silently, with the same "Error
      # opening file for writing" at the other end. v0.1.7 killed `GeneHub.exe`,
      # the name in the Start menu, while the process is `genethub-desktop.exe`.
      # Only the build knows which is which, so it is asked here rather than
      # assumed in a comment.
      - name: The installer stops processes that exist
        shell: bash
        run: |
          set -euo pipefail
          names="$(grep -oE '/IM [A-Za-z0-9._-]+\.exe' apps/desktop/src-tauri/installer.nsh \
            | sed 's|/IM ||' | sort -u)"
          test -n "$names" || { echo "::error::the installer hook stops nothing"; exit 1; }
          for name in $names; do
            found="$(find apps/desktop/src-tauri/target/release target/release \
              -maxdepth 1 -name "$name" -print -quit 2>/dev/null || true)"
            test -n "$found" || {
              echo "::error::installer.nsh stops '$name', but no executable of that name is built"
              exit 1
            }
            echo "ok: $name -> $found"
          done

      # Prove the binary that went into the installer runs on this platform at
      # all — a release that ships a daemon which cannot start is the failure
      # nobody notices until a user hits it (`docs/roadmap.md` MVP 验收清单).
      - name: Smoke the daemon on this platform
        shell: bash
        run: |
          set -uo pipefail
          root="$(mktemp -d)"
          exe=""
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe"
          # And that it is the build this release claims to be. Without this, a
          # job that lost its stamping step would ship a daemon calling itself
          # 0.0.0 — which tells every user they run an unreleased build, silently.
          ./scripts/version.sh --verify "target/release/genet-daemon$exe" || exit 1
          GENEHUB_DATA_DIR="$root/data" GENEHUB_WORKSPACE_DIR="$root/workspace" \
            "target/release/genet-daemon$exe" >"$root/out.json" 2>"$root/err.log" &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q '"event":"listening"' "$root/out.json" && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if ! grep -q '"event":"listening"' "$root/out.json"; then
            echo "FAIL: the daemon did not come up on ${{ matrix.platform }}" >&2
            cat "$root/err.log" >&2
            exit 1
          fi
          test -d "$root/workspace" \
            || { echo "FAIL: no folder to work in was created" >&2; exit 1; }
          echo "the daemon starts on ${{ matrix.platform }} and prepares a workspace"

      # Two names for one file, on purpose:
      #
      # The version-free one is what a link can point at forever
      # (`releases/latest/download/<name>`), which is what the install script and
      # the docs use.
      #
      # The versioned one is what a person downloads. A browser that has seen
      # `GeneHub-windows-x64-setup.exe` before saves the next one as `(1)`, and
      # then nobody — including whoever is debugging with them — can tell which
      # version is in which file.
      - name: Name the artifact, twice
        shell: bash
        run: |
          set -euo pipefail
          found="$(find apps/desktop/src-tauri/target/release/bundle -name '${{ matrix.pattern }}' -print -quit)"
          test -n "$found" || { echo "no installer matched ${{ matrix.pattern }}" >&2; exit 1; }
          mkdir -p dist
          cp "$found" "dist/${{ matrix.asset }}"
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            # Not a tag build: there is no version to put in a name.
            *[!0-9.]*|"") echo "no version in '$GITHUB_REF_NAME', keeping one name" ;;
            *) cp "$found" "dist/$(echo '${{ matrix.asset }}' | sed "s/^GeneHub-/GeneHub-$version-/")" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  # The pair `scripts/install.sh` downloads, and the whole of what Linux gets in
  # this version. Names here have to match what that script asks for.
  #
  # Built for musl and linked statically so a box with an older glibc (CentOS 7,
  # Ubuntu 20.04, many cloud images) can still run the download. A dynamic build
  # on ubuntu-22.04 was requiring GLIBC_2.34 and failing on those machines with
  # a wall of `version 'GLIBC_…' not found` — exactly what `curl | sh` users hit.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: genet-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # As in the installer job: the tag is where the version comes from.
      - run: ./scripts/version.sh --from-tag
      - run: cargo build --release -p genet-daemon -p genet-agent --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" \
            -C "target/${{ matrix.target }}/release" genet-daemon genet-agent
          ls -la dist
      # What the tarball promises: two binaries that start on a machine with no
      # graphical session and nothing else installed — including no particular
      # glibc. `ldd` saying "not a dynamic executable" is the claim; starting is
      # the proof.
      - name: Check the binaries in the tarball start on their own
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          tar -xzf "dist/${{ matrix.asset }}" -C "$root"
          # The unpacked copy, so this is a claim about what is in the tarball
          # rather than about what was left in the build directory.
          ./scripts/version.sh --verify "$root/genet-daemon"
          # Static-pie prints "statically linked" and exits 0; a fully static
          # binary may exit 1 with "not a dynamic executable". Either is fine.
          # What is not fine is a list of .so dependencies on the host glibc.
          ldd "$root/genet-daemon" >/tmp/ldd.out 2>&1 || true
          if grep -qiE 'not a dynamic|statically linked' /tmp/ldd.out; then
            echo "genet-daemon is statically linked"
          else
            echo "FAIL: genet-daemon is dynamically linked; old glibc hosts will break:" >&2
            cat /tmp/ldd.out >&2
            exit 1
          fi
          GENEHUB_DATA_DIR="$root/data" GENEHUB_WORKSPACE_DIR="$root/workspace" \
            timeout 30 "$root/genet-daemon" >"$root/out.json" 2>"$root/err.log" || true
          grep -q '"event":"listening"' "$root/out.json" || {
            echo "FAIL: the packed daemon did not come up" >&2
            cat "$root/err.log" >&2
            exit 1
          }
          test -d "$root/workspace" \
            || { echo "FAIL: no folder to work in was created" >&2; exit 1; }
          echo "the packed daemon is static, starts, and prepares a folder to work in"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # Not published: this is where the claims about what goes *inside* an installer
  # are checked, because `dpkg-deb` is the only tooling that can look. Losing the
  # Linux installer as a product must not lose the only check that the bundle has
  # no Node runtime in it and stays under the size budget.
  bundle-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: packages/web
      - run: npm ci
        working-directory: apps/desktop
      - name: Build a package and check what is inside it
        run: ./apps/desktop/scripts/bundle.sh
        env:
          BUNDLES: deb

  publish:
    needs: [installers, binaries, bundle-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # A fixed address for "what is the newest version", so the app's 检查更新
      # has something to ask that is not the GitHub API: 60 requests an hour is
      # counted per address, and everyone behind one office router shares it.
      #
      # Named without the version for the same reason as the installer, which is
      # what makes `releases/latest/download/latest.json` an address that never
      # moves.
      #
      # Shaped like a Tauri updater manifest although nothing signs anything yet:
      # if the shell ever grows an updater, this file at this URL is what it
      # reads, and there is no second thing to publish. `signature` is absent
      # rather than empty, so an updater would fail closed instead of accepting
      # an unsigned bundle.
      - name: Say what the newest version is, at an address that never moves
        run: |
          set -euo pipefail
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const repo = process.env.GITHUB_REPOSITORY;
            const version = tag.replace(/^v/, "");
            const release = `https://github.com/${repo}/releases`;
            require("node:fs").writeFileSync(
              "dist/latest.json",
              JSON.stringify(
                {
                  version,
                  pub_date: new Date().toISOString(),
                  // Where a person goes. The installer URL is for a machine; a
                  // human wants the notes and the checksums next to it.
                  page: `${release}/tag/${tag}`,
                  platforms: {
                    "windows-x86_64": {
                      url: `${release}/download/${tag}/GeneHub-${version}-windows-x64-setup.exe`,
                    },
                  },
                },
                null,
                2,
              ) + "\n",
            );
          '
          cat dist/latest.json
      # Checksums, because a download that arrives corrupted should be provable
      # rather than argued about.
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
