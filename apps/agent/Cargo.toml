[package]
name = "genet-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GeneHub built-in coding agent, driven over JSONL RPC on stdio"

[[bin]]
name = "genet-agent-local"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
genet-http = { path = "../../packages/http" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "sync", "time"] }
genet-wasi = { path = "../../packages/wasi-guest" }

[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
libc = "0.2"
