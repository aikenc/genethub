[package]
name = "genet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "genet: the GeneHub CLI, and the daemon it controls, in one binary"

# The one binary every channel ships. `scripts/channel.mjs` rewrites this
# name when it stamps a channel; the crate name stays put across channels.
[[bin]]
name = "genet-dev"
path = "src/main.rs"

[dependencies]
genet-daemon = { path = "../daemon" }
genehub-proto = { path = "../../packages/proto" }

anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
genet-daemon-platform = { path = "../../packages/daemon-platform" }
genehub-testing = { path = "../../testing" }
tempfile = "3"
