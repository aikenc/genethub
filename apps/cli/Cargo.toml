[package]
name = "genet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "genet: the GeneHub CLI, and the daemon it controls, in one binary"

# The one binary every channel ships. `scripts/channel.mjs` rewrites this
# name when it stamps a channel; the crate name stays put across channels.
[[bin]]
name = "genet-local"
path = "src/main.rs"

[dependencies]
# Not `genet-daemon`. The forwarder's own vocabulary — build identity, the data
# directory, the lock file, the loopback proofs, the answer envelope — lives in
# `genet-frontdoor`; the verbs live in the component and arrive over `POST /cli`
# (`docs/cli-thin-forwarder.md`). Linking the daemon for five modules is what
# made every session-kernel edit look like a change to the installed App.
genet-frontdoor = { path = "../../packages/frontdoor" }
genet-http = { path = "../../packages/http" }
genet-native = { path = "../../packages/native" }

base64.workspace = true
futures-util.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# Only the tests link the daemon: they start a real one in-process to assert the
# forwarder talks to it correctly. Nothing shipped in the binary depends on it.
genet-daemon = { path = "../daemon" }
genehub-testing = { path = "../../testing/deprecated/rust" }
tempfile = "3"
