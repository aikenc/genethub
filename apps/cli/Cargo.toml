[package]
name = "genet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "genet: the GeneHub CLI, and the daemon it controls, in one binary"

# The one binary every channel ships. `scripts/channel.mjs` rewrites this
# name when it stamps a channel; the crate name stays put across channels.
[[bin]]
name = "genet-local"
path = "src/main.rs"

[dependencies]
# Not `genet-daemon`. The forwarder's own vocabulary — build identity, the data
# directory, the lock file, the loopback proofs, the answer envelope — lives in
# `genet-frontdoor`; the verbs live in the component and arrive over `POST /cli`
# (`docs/cli-thin-forwarder.md`). Linking the daemon for five modules is what
# made every session-kernel edit look like a change to the installed App.
genet-frontdoor = { path = "../../packages/frontdoor" }
genet-http = { path = "../../packages/http" }
genet-native = { path = "../../packages/native" }

anyhow.workspace = true
cap-fs-ext = "4"
cap-std = "4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
subtle = "2"
uuid.workspace = true
flate2 = "1"
tar = "0.4"
base64.workspace = true
futures-util.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
