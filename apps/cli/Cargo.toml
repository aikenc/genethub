[package]
name = "genet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "genet: the GeneHub CLI, and the daemon it controls, in one binary"

# The one binary both channels ship. `scripts/channel.sh` rewrites this name
# for a beta build (`genet-beta`); the crate name stays put across channels.
[[bin]]
name = "genet"
path = "src/main.rs"

[dependencies]
genet-daemon = { path = "../daemon" }
genehub-proto = { path = "../../packages/proto" }

anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
