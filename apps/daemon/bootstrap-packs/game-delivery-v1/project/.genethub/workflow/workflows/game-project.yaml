schema: genehub.workflow.definition.v1
id: game-project
version: 2
entry: implement
nodes:
  - id: implement
    uses: agent.session
    with:
      role: coder
      writeLease:
        targetRef: current
        ttlSeconds: 900
    completion:
      all:
        - key: commit
          verify: git.commitOnTarget
        - key: checks
          verify: value.nonEmpty
    on:
      completed: [review]
  - id: review
    uses: agent.session
    with:
      role: reviewer
    completion:
      all:
        - key: review
          verify: value.equals
          expected: approved
        - key: checks
          verify: value.nonEmpty
    on:
      completed: [publish]
      changesRequested: [repair]
  - id: publish
    uses: result.publish
  - id: repair
    uses: agent.session
    with:
      role: coder
      writeLease:
        targetRef: current
        ttlSeconds: 900
    completion:
      all:
        - key: commit
          verify: git.commitOnTarget
        - key: checks
          verify: value.nonEmpty
    on:
      completed: [review-after-repair]
  - id: review-after-repair
    uses: agent.session
    with:
      role: reviewer
    completion:
      all:
        - key: review
          verify: value.equals
          expected: approved
        - key: checks
          verify: value.nonEmpty
    on:
      completed: [publish-repaired]
  - id: publish-repaired
    uses: result.publish
