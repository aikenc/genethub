schema: genehub.workflow.catalog.v1
workflows:
  - id: game-dev
    path: game-dev.yaml
  - id: workflow-improvement
    path: workflow-improvement.yaml
    match:
      kind: workflow
      complexity: improvement
  - id: workflow-review
    path: workflow-review.yaml
    match:
      kind: workflow
      complexity: review
  - id: game-assessment
    path: game-assessment.yaml
    match:
      kind: game
      complexity: assessment
  - id: game-review
    path: game-review.yaml
    match:
      kind: game
      complexity: review
  - id: game-review-and-improve
    path: game-review-and-improve.yaml
    match:
      kind: game
      complexity: review-and-improve
  - id: parallel-features
    path: parallel-features.yaml
    match:
      kind: game
      complexity: parallel-features
