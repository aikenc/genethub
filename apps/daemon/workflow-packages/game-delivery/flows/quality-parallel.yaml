schema: genehub.workflow.definition.v2
id: quality-parallel
version: 1
nodes:
- id: budget
  uses: request.budget
- id: plan-features
  uses: agent.session
  with:
    role: owner
  completion:
    output:
      type: object
      properties:
        decision:
          type: string
          enum:
          - go
          - noGo
          - needsAuthorization
        rationale:
          type: string
          minLength: 1
        features:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              goal:
                type: string
                minLength: 1
              branch:
                type: string
                minLength: 1
              criteria:
                type: array
                minItems: 1
                maxItems: 200
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    requirement:
                      type: string
                      minLength: 1
                    method:
                      type: string
                      minLength: 1
- id: prepare-branch
  uses: agent.session
  with:
    role: coder
  completion:
    all:
    - key: worktree
      verify: value.nonEmpty
    output:
      type: object
      properties:
        workspace:
          type: string
          minLength: 1
        branch:
          type: string
          minLength: 1
        baseCommit:
          type: string
          minLength: 40
- id: implement-feature
  uses: agent.session
  with:
    role: coder
    workspace:
      op: ref
      path: /input/workspace
    writeLease:
      ttlSeconds: 1800
  completion:
    all:
    - key: commit
      verify: value.nonEmpty
    - key: checks
      verify: value.nonEmpty
    output:
      type: object
      properties:
        commit:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
- id: integrate-feature
  uses: agent.session
  with:
    role: coder
    writeLease:
      ttlSeconds: 900
  completion:
    all:
    - key: commit
      verify: value.nonEmpty
    - key: checks
      verify: value.nonEmpty
    output:
      type: object
      properties:
        mainlineCommit:
          type: string
          minLength: 1
        notes:
          type: string
          minLength: 1
- id: publish
  uses: result.publish
- id: quality-review
  uses: agent.session
  with:
    role: reviewer
    workspace:
      op: ref
      path: /input/workspace
  completion:
    output:
      type: object
      properties:
        commit:
          type: string
          minLength: 1
        checklist:
          type: array
          maxItems: 512
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                - passed
                - failed
                - na
                - disputed
                - unverified
              reason:
                type: string
                minLength: 1
              evidence:
                type: string
              suggestion:
                type: string
- id: quality-gate
  uses: pack.script
  with:
    script: scripts/quality-gate.py
    interpreter: python3
  completion:
    all:
    - key: approved
      verify: value.nonEmpty
    - key: report
      verify: value.nonEmpty
- id: repair-mainline
  uses: agent.session
  with:
    role: coder
    writeLease:
      ttlSeconds: 900
  completion:
    all:
    - key: commit
      verify: value.nonEmpty
    - key: checks
      verify: value.nonEmpty
    output:
      type: object
      properties:
        commit:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
- id: quality-summary
  uses: pack.script
  with:
    script: scripts/quality-summary.py
    interpreter: python3
    timeoutSeconds: 30
  completion:
    all:
    - key: summary
      verify: value.nonEmpty
    - key: report
      verify: value.nonEmpty
    - key: approved
      verify: value.nonEmpty
- id: final-snapshot
  uses: pack.script
  with:
    script: scripts/final-snapshot.py
    interpreter: python3
    timeoutSeconds: 30
  completion:
    all:
    - key: commit
      verify: value.nonEmpty
structure:
  limits:
    maxOperations: 512
    maxConcurrency: 16
    maxFrames: 4096
  body:
    id: parallel-delivery
    type: sequence
    output:
      op: ref
      path: /results/deliver-or-stop
    steps:
    - id: planning-budget
      type: task
      activity: budget
    - id: plan
      type: task
      activity: plan-features
      input:
        op: object
        fields:
          phase:
            op: literal
            value: quality-planning
          budget:
            op: ref
            path: /results/planning-budget/output
      title: 冻结需求验收项
    - id: deliver-or-stop
      type: if
      condition:
        op: all
        values:
        - op: eq
          left:
            op: ref
            path: /results/plan/output/decision
          right:
            op: literal
            value: go
        - op: exists
          path: /results/plan/output/features/0
      else:
        id: stop-with-plan
        type: sequence
        steps: []
        output:
          op: object
          fields:
            done:
              op: literal
              value: false
            plan:
              op: ref
              path: /results/plan/output
            integrated:
              op: literal
              value: []
            rejected:
              op: literal
              value: []
      then:
        id: deliver
        type: sequence
        output:
          op: object
          fields:
            done:
              op: eq
              left:
                op: ref
                path: /results/report-quality/output/evidence/approved
              right:
                op: literal
                value: 'true'
            plan:
              op: ref
              path: /results/plan/output
            integrated:
              op: ref
              path: /results/summarize-features/integrated
            rejected:
              op: ref
              path: /results/summarize-features/rejected
            qualitySummary:
              op: ref
              path: /results/report-quality/output/evidence/summary
            qualityReport:
              op: ref
              path: /results/report-quality/output/evidence/report
            finalCommit:
              op: ref
              path: /results/final-audit/commit
        steps:
        - id: prepare-branches
          type: forEach
          items:
            op: ref
            path: /results/plan/output/features
          key:
            op: ref
            path: /item/id
          maxConcurrency: 1
          initial:
            op: literal
            value:
              prepared: []
          update:
            op: object
            fields:
              prepared:
                op: append
                array:
                  op: ref
                  path: /vars/prepared
                value:
                  op: object
                  fields:
                    id:
                      op: ref
                      path: /item/id
                    goal:
                      op: ref
                      path: /item/goal
                    criteria:
                      op: ref
                      path: /item/criteria
                    branch:
                      op: ref
                      path: /results/output/branch
                    baseCommit:
                      op: ref
                      path: /results/output/baseCommit
                    workspace:
                      op: ref
                      path: /results/output/workspace
          body:
            id: create-worktree
            type: task
            activity: prepare-branch
            input:
              op: object
              fields:
                phase:
                  op: literal
                  value: branch-preparation
                feature:
                  op: ref
                  path: /item
        - id: implement-features
          type: forEach
          items:
            op: ref
            path: /results/prepare-branches/prepared
          key:
            op: ref
            path: /item/id
          maxConcurrency: 4
          completeWhen:
            op: not
            value:
              op: eq
              left:
                op: ref
                path: /group/failed
              right:
                op: literal
                value: 0
          body:
            id: feature-branch
            type: sequence
            output:
              op: object
              fields:
                featureId:
                  op: ref
                  path: /item/id
                branch:
                  op: ref
                  path: /item/branch
                passed:
                  op: ref
                  path: /results/quality-iteration/approved
                finding:
                  op: ref
                  path: /results/quality-iteration/feedback
                integrated:
                  op: ref
                  path: /results/integration/integrated
                mainlineCommit:
                  op: ref
                  path: /results/integration/mainlineCommit
                integrationFinding:
                  op: ref
                  path: /results/integration/finding
            steps:
            - id: quality-iteration
              type: loop
              maxRounds: 3
              initial:
                op: literal
                value:
                  approved: false
                  feedback: null
                  commit: null
                  round: 0
              condition:
                op: all
                values:
                - op: not
                  value:
                    op: ref
                    path: /vars/approved
                - op: lt
                  left:
                    op: ref
                    path: /vars/round
                  right:
                    op: literal
                    value: 3
              update:
                op: object
                fields:
                  approved:
                    op: eq
                    left:
                      op: ref
                      path: /results/gate/output/evidence/approved
                    right:
                      op: literal
                      value: 'true'
                  feedback:
                    op: ref
                    path: /results/gate/output/evidence/report
                  commit:
                    op: ref
                    path: /results/implementation/output/commit
                  round:
                    op: add
                    left:
                      op: ref
                      path: /vars/round
                    right:
                      op: literal
                      value: 1
              body:
                id: implement-and-review
                type: sequence
                steps:
                - id: implementation
                  type: task
                  activity: implement-feature
                  input:
                    op: object
                    fields:
                      phase:
                        op: literal
                        value: branch-implementation
                      feature:
                        op: ref
                        path: /item
                      workspace:
                        op: ref
                        path: /item/workspace
                      branch:
                        op: ref
                        path: /item/branch
                      feedback:
                        op: ref
                        path: /vars/feedback
                - id: reviews
                  type: parallel
                  branches:
                  - id: requirements
                    type: task
                    activity: quality-review
                    input:
                      op: object
                      fields:
                        phase:
                          op: literal
                          value: quality-review
                        group:
                          op: literal
                          value: requirements
                        feature:
                          op: ref
                          path: /item
                        workspace:
                          op: ref
                          path: /item/workspace
                        commit:
                          op: ref
                          path: /results/implementation/output/commit
                        checklist:
                          op: ref
                          path: /item/criteria
                  - id: product
                    type: task
                    activity: quality-review
                    input:
                      op: object
                      fields:
                        phase:
                          op: literal
                          value: quality-review
                        group:
                          op: literal
                          value: product
                        feature:
                          op: ref
                          path: /item
                        workspace:
                          op: ref
                          path: /item/workspace
                        commit:
                          op: ref
                          path: /results/implementation/output/commit
                        checklist:
                          op: include
                          path: checklists/product.yaml
                  - id: engineering
                    type: task
                    activity: quality-review
                    input:
                      op: object
                      fields:
                        phase:
                          op: literal
                          value: quality-review
                        group:
                          op: literal
                          value: engineering
                        feature:
                          op: ref
                          path: /item
                        workspace:
                          op: ref
                          path: /item/workspace
                        commit:
                          op: ref
                          path: /results/implementation/output/commit
                        checklist:
                          op: include
                          path: checklists/engineering.yaml
                - id: gate
                  type: task
                  activity: quality-gate
                  input:
                    op: object
                    fields:
                      commit:
                        op: ref
                        path: /results/implementation/output/commit
                      feature:
                        op: ref
                        path: /item
                      requirements:
                        op: ref
                        path: /item/criteria
                      product:
                        op: include
                        path: checklists/product.yaml
                      engineering:
                        op: include
                        path: checklists/engineering.yaml
                      reviews:
                        op: ref
                        path: /results/reviews
              title: 功能线实现与三路验收
            - id: integration
              type: if
              condition:
                op: ref
                path: /results/quality-iteration/approved
              else:
                id: skip-integration
                type: sequence
                steps: []
                output:
                  op: object
                  fields:
                    integrated:
                      op: literal
                      value: false
                    mainlineCommit:
                      op: literal
                      value: null
                    finding:
                      op: literal
                      value: null
              then:
                id: integrate
                type: sequence
                output:
                  op: object
                  fields:
                    integrated:
                      op: ref
                      path: /results/mainline-quality/approved
                    mainlineCommit:
                      op: ref
                      path: /results/mainline-quality/commit
                    finding:
                      op: ref
                      path: /results/mainline-quality/feedback
                steps:
                - id: merge-to-mainline
                  type: task
                  activity: integrate-feature
                  input:
                    op: object
                    fields:
                      phase:
                        op: literal
                        value: mainline-integration
                      feature:
                        op: ref
                        path: /item
                      branch:
                        op: ref
                        path: /item/branch
                      featureCommit:
                        op: ref
                        path: /results/quality-iteration/commit
                      review:
                        op: ref
                        path: /results/quality-iteration/feedback
                - id: mainline-quality
                  title: 主线集成验收与修复
                  type: loop
                  maxRounds: 2
                  initial:
                    op: object
                    fields:
                      approved:
                        op: literal
                        value: false
                      round:
                        op: literal
                        value: 0
                      feedback:
                        op: literal
                        value: null
                      commit:
                        op: ref
                        path: /results/merge-to-mainline/output/mainlineCommit
                  condition:
                    op: all
                    values:
                    - op: not
                      value:
                        op: ref
                        path: /vars/approved
                    - op: lt
                      left:
                        op: ref
                        path: /vars/round
                      right:
                        op: literal
                        value: 2
                  update:
                    op: object
                    fields:
                      approved:
                        op: eq
                        left:
                          op: ref
                          path: /results/mainline-gate/output/evidence/approved
                        right:
                          op: literal
                          value: 'true'
                      round:
                        op: add
                        left:
                          op: ref
                          path: /vars/round
                        right:
                          op: literal
                          value: 1
                      feedback:
                        op: ref
                        path: /results/mainline-gate/output/evidence/report
                      commit:
                        op: ref
                        path: /results/mainline-revision/commit
                  body:
                    id: check-integrated-mainline
                    type: sequence
                    steps:
                    - id: mainline-revision
                      type: if
                      condition:
                        op: lt
                        left:
                          op: literal
                          value: 0
                        right:
                          op: ref
                          path: /vars/round
                      then:
                        id: repair-mainline-and-select
                        type: sequence
                        steps:
                        - id: repair-integrated-mainline
                          type: task
                          activity: repair-mainline
                          input:
                            op: object
                            fields:
                              phase:
                                op: literal
                                value: mainline-repair
                              feature:
                                op: ref
                                path: /item
                              feedback:
                                op: ref
                                path: /vars/feedback
                        output:
                          op: object
                          fields:
                            commit:
                              op: ref
                              path: /results/repair-integrated-mainline/output/commit
                      else:
                        id: use-merged-mainline
                        type: sequence
                        steps: []
                        output:
                          op: object
                          fields:
                            commit:
                              op: ref
                              path: /vars/commit
                    - id: mainline-reviews
                      type: parallel
                      branches:
                      - id: mainline-requirements
                        type: task
                        activity: quality-review
                        input:
                          op: object
                          fields:
                            phase:
                              op: literal
                              value: quality-review
                            group:
                              op: literal
                              value: requirements
                            feature:
                              op: ref
                              path: /item
                            workspace:
                              op: literal
                              value: .
                            commit:
                              op: ref
                              path: /results/mainline-revision/commit
                            checklist:
                              op: ref
                              path: /item/criteria
                      - id: mainline-product
                        type: task
                        activity: quality-review
                        input:
                          op: object
                          fields:
                            phase:
                              op: literal
                              value: quality-review
                            group:
                              op: literal
                              value: product
                            feature:
                              op: ref
                              path: /item
                            workspace:
                              op: literal
                              value: .
                            commit:
                              op: ref
                              path: /results/mainline-revision/commit
                            checklist:
                              op: include
                              path: checklists/product.yaml
                      - id: mainline-engineering
                        type: task
                        activity: quality-review
                        input:
                          op: object
                          fields:
                            phase:
                              op: literal
                              value: quality-review
                            group:
                              op: literal
                              value: engineering
                            feature:
                              op: ref
                              path: /item
                            workspace:
                              op: literal
                              value: .
                            commit:
                              op: ref
                              path: /results/mainline-revision/commit
                            checklist:
                              op: include
                              path: checklists/engineering.yaml
                    - id: mainline-gate
                      type: task
                      activity: quality-gate
                      input:
                        op: object
                        fields:
                          commit:
                            op: ref
                            path: /results/mainline-revision/commit
                          feature:
                            op: ref
                            path: /item
                          requirements:
                            op: ref
                            path: /item/criteria
                          product:
                            op: include
                            path: checklists/product.yaml
                          engineering:
                            op: include
                            path: checklists/engineering.yaml
                          reviews:
                            op: object
                            fields:
                              requirements:
                                op: ref
                                path: /results/mainline-reviews/mainline-requirements
                              product:
                                op: ref
                                path: /results/mainline-reviews/mainline-product
                              engineering:
                                op: ref
                                path: /results/mainline-reviews/mainline-engineering
          title: 并行功能线
        - id: summarize-features
          type: forEach
          items:
            op: entries
            value:
              op: ref
              path: /results/implement-features
          key:
            op: ref
            path: /item/key
          maxConcurrency: 1
          initial:
            op: literal
            value:
              integrated: []
              rejected: []
              done: false
          update:
            op: object
            fields:
              integrated:
                op: ref
                path: /results/integrated
              rejected:
                op: ref
                path: /results/rejected
              done:
                op: all
                values:
                - op: exists
                  path: /results/integrated/0
                - op: not
                  value:
                    op: exists
                    path: /results/rejected/0
          body:
            id: classify-branch
            type: if
            condition:
              op: ref
              path: /item/value/integrated
            then:
              id: keep-integrated
              type: sequence
              steps: []
              output:
                op: object
                fields:
                  integrated:
                    op: append
                    array:
                      op: ref
                      path: /vars/integrated
                    value:
                      op: ref
                      path: /item/value
                  rejected:
                    op: ref
                    path: /vars/rejected
            else:
              id: keep-rejected
              type: sequence
              steps: []
              output:
                op: object
                fields:
                  integrated:
                    op: ref
                    path: /vars/integrated
                  rejected:
                    op: append
                    array:
                      op: ref
                      path: /vars/rejected
                    value:
                      op: ref
                      path: /item/value
        - id: final-audit
          title: 发布前最终提交复验
          type: if
          condition:
            op: ref
            path: /results/summarize-features/done
          else:
            id: skip-final-audit
            type: sequence
            steps: []
            output:
              op: literal
              value:
                commit: null
                reviews: {}
          then:
            id: audit-final-commit
            type: sequence
            steps:
            - id: final-snapshot
              type: task
              activity: final-snapshot
              input:
                op: literal
                value: {}
            - id: verify-final-features
              type: call
              procedure: final-feature-audits
              input:
                op: object
                fields:
                  commit:
                    op: ref
                    path: /results/final-snapshot/output/evidence/commit
                  features:
                    op: ref
                    path: /results/prepare-branches/prepared
            output:
              op: object
              fields:
                commit:
                  op: ref
                  path: /results/final-snapshot/output/evidence/commit
                reviews:
                  op: ref
                  path: /results/verify-final-features
        - id: report-quality
          type: task
          activity: quality-summary
          input:
            op: object
            fields:
              features:
                op: ref
                path: /results/implement-features
              finalReviews:
                op: ref
                path: /results/final-audit/reviews
              finalCommit:
                op: ref
                path: /results/final-audit/commit
        - id: publish-integrated
          type: if
          condition:
            op: eq
            left:
              op: ref
              path: /results/report-quality/output/evidence/approved
            right:
              op: literal
              value: 'true'
          then:
            id: publish-result
            type: task
            activity: publish
  procedures:
    final-feature-audits:
      id: audit-final-feature-list
      type: forEach
      items:
        op: ref
        path: /input/features
      key:
        op: ref
        path: /item/id
      maxConcurrency: 4
      body:
        id: final-feature-audit
        type: sequence
        steps:
        - id: final-reviews
          type: parallel
          branches:
          - id: final-requirements
            type: task
            activity: quality-review
            input:
              op: object
              fields:
                phase:
                  op: literal
                  value: quality-review
                group:
                  op: literal
                  value: requirements
                feature:
                  op: ref
                  path: /item
                workspace:
                  op: literal
                  value: .
                commit:
                  op: ref
                  path: /input/commit
                checklist:
                  op: ref
                  path: /item/criteria
                finalAudit:
                  op: literal
                  value: true
          - id: final-product
            type: task
            activity: quality-review
            input:
              op: object
              fields:
                phase:
                  op: literal
                  value: quality-review
                group:
                  op: literal
                  value: product
                feature:
                  op: ref
                  path: /item
                workspace:
                  op: literal
                  value: .
                commit:
                  op: ref
                  path: /input/commit
                checklist:
                  op: include
                  path: checklists/product.yaml
                finalAudit:
                  op: literal
                  value: true
          - id: final-engineering
            type: task
            activity: quality-review
            input:
              op: object
              fields:
                phase:
                  op: literal
                  value: quality-review
                group:
                  op: literal
                  value: engineering
                feature:
                  op: ref
                  path: /item
                workspace:
                  op: literal
                  value: .
                commit:
                  op: ref
                  path: /input/commit
                checklist:
                  op: include
                  path: checklists/engineering.yaml
                finalAudit:
                  op: literal
                  value: true
        - id: final-gate
          type: task
          activity: quality-gate
          input:
            op: object
            fields:
              commit:
                op: ref
                path: /input/commit
              feature:
                op: ref
                path: /item
              requirements:
                op: ref
                path: /item/criteria
              product:
                op: include
                path: checklists/product.yaml
              engineering:
                op: include
                path: checklists/engineering.yaml
              reviews:
                op: object
                fields:
                  requirements:
                    op: ref
                    path: /results/final-reviews/final-requirements
                  product:
                    op: ref
                    path: /results/final-reviews/final-product
                  engineering:
                    op: ref
                    path: /results/final-reviews/final-engineering
        output:
          op: object
          fields:
            featureId:
              op: ref
              path: /item/id
            finding:
              op: ref
              path: /results/final-gate/output/evidence/report
