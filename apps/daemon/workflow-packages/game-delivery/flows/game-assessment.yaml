schema: genehub.workflow.definition.v2
id: game-assessment
version: 2
nodes:
  - id: assess
    uses: agent.session
    with:
      role: reviewer
    completion:
      all:
        - key: report
          verify: value.nonEmpty
  - id: publish
    uses: result.publish
structure:
  body:
    id: report-flow
    type: sequence
    steps:
      - {id: report, type: task, activity: assess}
      - {id: result, type: task, activity: publish}
