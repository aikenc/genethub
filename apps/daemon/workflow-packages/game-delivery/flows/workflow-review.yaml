schema: genehub.workflow.definition.v2
id: workflow-review
version: 2
nodes:
  - id: specialist
    uses: agent.session
    with:
      role: workflow-reviewer
    completion:
      all:
        - key: report
          verify: value.nonEmpty
  - id: publish
    uses: result.publish
structure:
  body:
    id: report-flow
    type: sequence
    steps:
      - {id: report, type: task, activity: specialist}
      - {id: result, type: task, activity: publish}
