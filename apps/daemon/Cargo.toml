[package]
name = "genet-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GeneHub daemon: session kernel, agent adapters and client transports"

# No [[bin]] here: the daemon is a library, run through the `genet` binary
# (`apps/cli`) as `genet daemon run` — one file that is both the client and
# the resident process (`genethub-cli.md` §2).

[dependencies]
genehub-proto = { path = "../../packages/proto" }
genet-daemon-logic-api = { path = "../../packages/daemon-logic-api" }
genet-daemon-platform = { path = "../../packages/daemon-platform" }

anyhow.workspace = true
aes-gcm.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
bytes = "1"
chrono.workspace = true
futures-util.workspace = true
fs2.workspace = true
hmac.workspace = true
ignore.workspace = true
json5.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
cap-std = "4.0.2"
dirs = "6"
libc = "0.2"
portable-pty = "0.9"
sha2 = "0.10"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
