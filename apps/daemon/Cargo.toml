[package]
name = "genet-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GeneHub daemon: session kernel, agent adapters and client transports"

# Native product entry remains `genet daemon run` (`apps/cli`), which execs
# the shell with the single v2 component (`apps/guest`) — this crate is the
# daemon half of that component.

[lib]
path = "src/lib.rs"

[dependencies]
genehub-proto = { path = "../../packages/proto" }
genet-frontdoor = { path = "../../packages/frontdoor" }
genet-native = { path = "../../packages/native" }

anyhow.workspace = true
aes-gcm.workspace = true
base64.workspace = true
bytes = "1"
chrono.workspace = true
futures-util.workspace = true
hmac.workspace = true
ignore.workspace = true
json5.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
genet-http = { path = "../../packages/http" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
fs2.workspace = true
tokio.workspace = true
cap-std = "4.0.2"
portable-pty = "0.9"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.17.2"

[target.'cfg(target_family = "wasm")'.dependencies]
genet-wasi = { path = "../../packages/wasi-guest" }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tokio = { version = "1", default-features = false, features = [
  "rt",
  "macros",
  "io-util",
  "time",
  "sync",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
