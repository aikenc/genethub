<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UE 串流</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#stream{width:100vw;height:100vh}
#bar{position:fixed;top:8px;left:8px;padding:4px 10px;border-radius:6px;background:#000a;color:#fff;font:13px system-ui}</style>
<div id="stream"></div><div id="bar">连接中…</div>
<script type="module">
import { Config, PixelStreaming, Flags, NumericParameters, TextParameters } from './pixelstreaming.esm.js';
const bar = document.getElementById('bar');
const say = text => { bar.textContent = text; };
// The platform decides the ICE servers (including relay when the viewer allows it);
// when it names any, they replace whatever the signalling server sends in its own config.
let iceServers = null;
try { ({ iceServers } = await window.genehubServicePreview.ice()); }
catch { say('请先在预览信息中允许本次登记服务'); }
if (iceServers?.length) {
  const Native = window.RTCPeerConnection;
  window.RTCPeerConnection = class extends Native { constructor(cfg = {}) { super({ ...cfg, iceServers }); } };
}
// Locked mouse is what a third-person game expects; the page sandbox allows it. The signalling
// address is one relative path through the preview bridge; the runner forwards it to the signalling
// server. The library only connects when asked: the stock UI layer calls this itself.
const config = new Config({ useUrlParams: false, initialSettings: {
  [TextParameters.SignallingServerUrl]: 'wss://preview.invalid/api/ue/ws',
  // While the game is still starting the library asks for streamers again every few seconds.
  [NumericParameters.MaxReconnectAttempts]: 100,
  [Flags.AutoPlayVideo]: true, [Flags.StartVideoMuted]: true,
  [Flags.HoveringMouseMode]: false, [Flags.WaitForStreamer]: true, [Flags.SuppressBrowserKeys]: true,
} });
const stream = new PixelStreaming(config, { videoElementParent: document.getElementById('stream') });
stream.addEventListener('streamerListMessage', e => { if (!e.data?.messageStreamerList?.ids?.length) say('等待游戏启动（首次可能需要几分钟）…'); });
stream.addEventListener('webRtcConnecting', () => say('正在连接游戏…'));
stream.addEventListener('webRtcConnected', () => say('已连接。点击画面开始，Esc 退出鼠标锁定，点击画面可开启声音'));
stream.addEventListener('webRtcFailed', () => say('连接失败，请重新启用本次登记服务'));
stream.addEventListener('webRtcDisconnected', () => say('连接已断开；若是撤销或停止，请重新启用本次登记服务'));
stream.addEventListener('playStreamRejected', () => say('点击画面开始播放'));
stream.connect();
document.getElementById('stream').addEventListener('click', () => {
  const video = document.querySelector('video'); if (video) video.muted = false;
});
</script></html>
