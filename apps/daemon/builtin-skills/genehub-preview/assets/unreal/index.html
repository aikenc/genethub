<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UE 串流</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#stream{width:100vw;height:100vh}
#bar{position:fixed;top:8px;left:8px;padding:4px 10px;border-radius:6px;background:#000a;color:#fff;font:13px system-ui}</style>
<div id="stream"></div><div id="bar">连接中…</div>
<script type="module">
import { Config, PixelStreaming, Flags, NumericParameters, TextParameters } from './pixelstreaming.esm.js';
const bar = document.getElementById('bar');
const say = text => { bar.textContent = text; };
// The platform supplies channel ICE (STUN/TURN unless direct-only was selected). Both ends
// use them: they replace what the signalling server's config names for this page, and the
// first message on the signalling socket hands them to signalling.py, which passes them to
// Unreal before the game creates its side of the connection. Without that, a game behind
// another network's NAT only offers LAN addresses and the picture never arrives.
async function start() {
let iceServers = null;
try { ({ iceServers } = await window.genehubServicePreview.ice()); }
catch { say('预览服务尚未就绪，正在等待连接；可点击上方“重新连接”重试'); return; }
// Viewers on another machine (including the same company network, whose tunnel blocks direct
// paths) may need the platform relay, selected automatically by the channel policy.
// The library reports "connected" before media flows, so the peer connection's own state decides.
const relayGranted = !!iceServers?.some(server => server.username);
const relayHint = '媒体连接失败：请检查源电脑与中继可达性，或点击上方“重新连接”';
let hintTimer = 0;
const peerState = pc => {
  if (pc.connectionState === 'connected') { clearTimeout(hintTimer); say('已连接。点击画面开始，Esc 退出鼠标锁定，点击画面可开启声音'); }
  else if (pc.connectionState === 'failed') { clearTimeout(hintTimer); say(relayGranted ? '媒体连接失败，请点击上方“重新连接”重试' : relayHint); }
};
const Native = window.RTCPeerConnection;
window.RTCPeerConnection = class extends Native {
  constructor(cfg = {}) {
    super(iceServers?.length ? { ...cfg, iceServers } : cfg);
    this.addEventListener('connectionstatechange', () => peerState(this));
    clearTimeout(hintTimer);
    if (!relayGranted) hintTimer = setTimeout(() => say(relayHint), 12000);
  }
};
if (iceServers?.length) {
  const Socket = window.WebSocket;
  window.WebSocket = class extends Socket {
    constructor(...args) { super(...args); this.addEventListener('open', () => this.send(JSON.stringify({ type: 'iceServers', iceServers }))); }
  };
}
// Locked mouse is what a third-person game expects; the page sandbox allows it. The signalling
// address is one relative path through the preview bridge; the runner forwards it to the signalling
// server. The library only connects when asked: the stock UI layer calls this itself.
const config = new Config({ useUrlParams: false, initialSettings: {
  [TextParameters.SignallingServerUrl]: 'wss://preview.invalid/api/ue/ws',
  // While the game is still starting the library asks for streamers again every few seconds.
  [NumericParameters.MaxReconnectAttempts]: 100,
  [Flags.AutoPlayVideo]: true, [Flags.StartVideoMuted]: true,
  [Flags.HoveringMouseMode]: false, [Flags.WaitForStreamer]: true, [Flags.SuppressBrowserKeys]: true,
} });
const stream = new PixelStreaming(config, { videoElementParent: document.getElementById('stream') });
stream.addEventListener('streamerListMessage', e => { if (!e.data?.messageStreamerList?.ids?.length) say('等待游戏启动（首次可能需要几分钟）…'); });
stream.addEventListener('webRtcConnecting', () => say('正在连接游戏…'));
stream.addEventListener('webRtcFailed', () => { clearTimeout(hintTimer); say(relayGranted ? '媒体连接失败，请点击上方“重新连接”重试' : relayHint); });
stream.addEventListener('webRtcDisconnected', () => say('游戏连接已断开，正在尝试重连；也可点击上方“重新连接”'));
stream.addEventListener('playStreamRejected', () => say('点击画面开始播放'));
stream.connect();
document.getElementById('stream').addEventListener('click', () => {
  const video = document.querySelector('video'); if (video) video.muted = false;
});
}
void start();
</script></html>
