schema: genehub-pm-dcg.v1
id: migration
kind: sessionWorkflow
version: 3
entry: investigate
executionBudget: { wallClockMs: 600000, maxWorkSessions: 16, maxConcurrentWorkSessions: 4 }
nodes:
  - id: investigate
    kind: activity
    executor:
      actor: workAgent
      space: { matchTags: [research], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/diagnose.md }
  - id: migrate
    kind: activity
    executor:
      actor: workAgent
      space: { matchTags: [migration], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/implement.md }
    fanout: { source: investigate.migrationSlices, maxItems: 4 }
  - id: review
    kind: activity
    executor: { actor: system }
  - id: prepare-recovery
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/repair-space.md }
    outputs: [recovery.ready]
  - id: recover
    kind: activity
    executor: { actor: user }
  - id: delivered
    kind: terminal
    outcome: delivered
  - id: cancelled
    kind: terminal
    outcome: cancelled
edges:
  - { id: investigated, from: investigate, to: migrate, when: work.accepted }
  - { id: investigation-blocked, from: investigate, to: prepare-recovery, when: { any: [work.blocked, space.quarantined] } }
  - { id: migrated, from: migrate, to: review, when: work.candidate }
  - { id: migration-blocked, from: migrate, to: prepare-recovery, when: { any: [work.blocked, space.quarantined] } }
  - { id: accepted, from: review, to: delivered, when: review.pass }
  - { id: review-failed, from: review, to: prepare-recovery, when: review.fail }
  - { id: recovery-prepared, from: prepare-recovery, to: recover, when: recovery.ready }
  - id: retry-migration
    label: 修正迁移方案后重试
    from: recover
    to: migrate
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: reinvestigate
    label: 补充调研
    from: recover
    to: investigate
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: cancel
    label: 取消本次迁移
    from: recover
    to: cancelled
    when: decision.ready
    chooseBy: user
