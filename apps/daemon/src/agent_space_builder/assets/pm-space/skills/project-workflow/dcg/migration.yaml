schema: genehub-pm-dcg.v1
id: migration
kind: sessionWorkflow
version: 7
entry: intake
executionBudget: { wallClockMs: 600000, maxWorkSessions: 16, maxConcurrentWorkSessions: 4 }
nodes:
  - id: intake
    kind: activity
    activity: pm
    executor: { actor: pm }
    objective: { prompt: prompts/intake.md }
    outputs: [intent.aligned]
  - id: migrate
    kind: activity
    activity: work
    executor:
      actor: workAgent
      space: { matchTags: [migration], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/implement.md }
    fanout: { source: plan.migrationSlices, maxItems: 4 }
  - id: review
    kind: activity
    activity: review
    executor:
      actor: reviewer
      space: { matchTags: [review], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/review.md }
    capacity: 4
  - id: approve-delivery
    kind: activity
    activity: userDecision
    executor: { actor: user }
  - id: integrate
    kind: activity
    activity: integrate
    executor: { actor: system }
  - id: review-triage
    kind: activity
    activity: pm
    executor: { actor: pm }
    objective: { prompt: prompts/triage-review.md }
    outputs: [review.rework.ready, review.escalation.ready]
  - id: prepare-recovery
    kind: activity
    activity: pm
    executor: { actor: pm }
    objective: { prompt: prompts/repair-space.md }
    outputs: [recovery.ready]
  - id: recover
    kind: activity
    activity: userDecision
    executor: { actor: user }
  - id: delivered
    kind: terminal
    outcome: delivered
  - id: cancelled
    kind: terminal
    outcome: cancelled
edges:
  - { id: aligned, from: intake, to: migrate, when: { all: [intent.persisted, intent.aligned] } }
  - { id: migrated, from: migrate, to: review, when: work.candidate }
  - { id: migration-blocked, from: migrate, to: prepare-recovery, when: { any: [work.blocked, space.quarantined] } }
  - { id: accepted, from: review, to: approve-delivery, when: review.pass }
  - id: delivery-approved
    label: 批准集成迁移
    from: approve-delivery
    to: integrate
    when: decision.ready
    chooseBy: user
  - id: delivery-cancelled
    label: 取消本次迁移
    from: approve-delivery
    to: cancelled
    when: decision.ready
    chooseBy: user
  - { id: review-failed, from: review, to: review-triage, when: review.fail }
  - { id: review-rework, from: review-triage, to: migrate, when: review.rework.ready, chooseBy: pm, maxTraversals: 2 }
  - { id: review-escalate, from: review-triage, to: recover, when: review.escalation.ready, chooseBy: pm }
  - { id: integrated, from: integrate, to: delivered, when: baseline.integrated }
  - { id: integration-blocked, from: integrate, to: prepare-recovery, when: integration.blocked }
  - { id: recovery-prepared, from: prepare-recovery, to: recover, when: recovery.ready }
  - id: retry-migration
    label: 修正迁移方案后重试
    from: recover
    to: migrate
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: cancel
    label: 取消本次迁移
    from: recover
    to: cancelled
    when: decision.ready
    chooseBy: user
