schema: genehub-pm-dcg.v1
id: bugfix
kind: sessionWorkflow
version: 4
entry: fix
executionBudget: { wallClockMs: 600000, maxWorkSessions: 12, maxConcurrentWorkSessions: 3 }
nodes:
  - id: fix
    kind: activity
    executor:
      actor: workAgent
      space: { matchTags: [implementation], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/implement.md }
  - id: review
    kind: activity
    executor: { actor: system }
  - id: integrate
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/integrate.md }
  - id: prepare-recovery
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/repair-space.md }
    outputs: [recovery.ready]
  - id: recover
    kind: activity
    executor: { actor: user }
  - id: delivered
    kind: terminal
    outcome: delivered
  - id: cancelled
    kind: terminal
    outcome: cancelled
edges:
  - { id: fixed, from: fix, to: review, when: work.candidate }
  - { id: fix-blocked, from: fix, to: prepare-recovery, when: { any: [work.blocked, space.quarantined] } }
  - { id: accepted, from: review, to: integrate, when: review.pass }
  - { id: review-failed, from: review, to: prepare-recovery, when: review.fail }
  - { id: integrated, from: integrate, to: delivered, when: baseline.integrated }
  - { id: integration-blocked, from: integrate, to: prepare-recovery, when: integration.blocked }
  - { id: recovery-prepared, from: prepare-recovery, to: recover, when: recovery.ready }
  - id: retry-fix
    label: 修正后重试
    description: 回到修复阶段，保留复现和评审证据。
    from: recover
    to: fix
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: cancel
    label: 取消本次修复
    from: recover
    to: cancelled
    when: decision.ready
    chooseBy: user
