schema: genehub-pm-dcg.v1
id: feature
kind: sessionWorkflow
version: 2
entry: intake
nodes:
  - id: intake
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/intake.md }
    outputs: [intent.aligned]
  - id: plan
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/plan.md }
    outputs: [plan.ready]
  - id: implement
    kind: activity
    executor:
      actor: workAgent
      space: { matchTags: [implementation], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/implement.md }
    fanout: { source: plan.workstreams, maxItems: 4 }
  - id: review
    kind: activity
    executor: { actor: system }
  - id: integrate
    kind: activity
    executor:
      actor: workAgent
      space: { matchTags: [integration], lease: exclusive, cleanRequired: true }
    objective: { prompt: prompts/integrate.md }
  - id: prepare-recovery
    kind: activity
    executor: { actor: pm }
    objective: { prompt: prompts/repair-space.md }
    outputs: [recovery.ready]
  - id: recover
    kind: activity
    executor: { actor: user }
  - id: delivered
    kind: terminal
    outcome: delivered
  - id: cancelled
    kind: terminal
    outcome: cancelled
edges:
  - id: aligned
    from: intake
    to: plan
    when: { all: [intent.persisted, intent.aligned] }
  - { id: planned, from: plan, to: implement, when: plan.ready }
  - { id: implemented, from: implement, to: review, when: work.candidate }
  - { id: implementation-blocked, from: implement, to: prepare-recovery, when: { any: [work.blocked, work.cancelled, space.quarantined] } }
  - { id: approved, from: review, to: integrate, when: review.pass }
  - { id: review-failed, from: review, to: prepare-recovery, when: review.fail }
  - { id: integration-blocked, from: integrate, to: prepare-recovery, when: { any: [work.blocked, work.cancelled, space.quarantined] } }
  - { id: recovery-prepared, from: prepare-recovery, to: recover, when: recovery.ready }
  - id: retry
    label: 采用修正方案重试
    description: 保持当前验收目标，返回实现阶段并创建新的候选。
    from: recover
    to: implement
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: replan
    label: 调整方案后重新规划
    description: 保留原始证据，回到规划阶段更新工作包。
    from: recover
    to: plan
    when: decision.ready
    chooseBy: user
    maxTraversals: 2
  - id: cancel
    label: 取消本次需求
    description: 结束当前 Run，不改变其他 PM Session。
    from: recover
    to: cancelled
    when: decision.ready
    chooseBy: user
  - { id: complete, from: integrate, to: delivered, when: work.accepted }
