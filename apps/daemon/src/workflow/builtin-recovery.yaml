schema: genehub.workflow.definition.v2
id: builtin-recovery
version: 2
nodes:
  - id: diagnose
    uses: agent.session
    with: {role: recovery-reviewer}
    completion:
      all:
        - {key: report, verify: value.nonEmpty}
  - id: publish
    uses: result.publish
structure:
  body:
    id: report
    type: sequence
    steps:
      - {id: diagnosis, type: task, activity: diagnose}
      - {id: report-ready, type: task, activity: publish}
