[package]
name = "genehub-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The single v2 wasm component: daemon `run` and agent `agent-run` exports of one artifact"
publish = false

# A cdylib so the component exports the `daemon` world's two entries rather
    # than `wasi:cli/run`. On a native target the crate is empty: it exists only
    # to be built for wasm32-wasip2.
[lib]
crate-type = ["cdylib"]

[build-dependencies]
sha2 = "0.10"

[dependencies]
genet-agent = { path = "../agent" }
genet-daemon = { path = "../daemon" }

[target.'cfg(target_family = "wasm")'.dependencies]
genet-wasi = { path = "../../packages/wasi-guest" }
tokio = { version = "1", default-features = false, features = ["rt"] }
