<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeneHub</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #181b1a; color: #ecefed; }
      main { width: min(32rem, calc(100vw - 3rem)); text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 600; }
      p { color: #aeb7b2; line-height: 1.6; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>GeneHub 正在启动</h1>
      <p id="status">正在启动本机 daemon，并准备登录官网。</p>
    </main>
  </body>
</html>
