[package]
name = "genethub-desktop"
# Written by `scripts/version.mjs` at release time, along with the workspace next
# door and `tauri.conf.json`. A literal is unavoidable here — this crate sits
# outside that workspace on purpose, and Cargo can neither inherit across
# workspaces nor read another file — so a script writes it rather than a person.
version = "0.0.0"
description = "GeneHub desktop client"
edition = "2021"
# No `rust-version`: nothing here is published to crates.io, and the rest of the
# workspace declares none either — it is built with current stable. The figure
# Tauri's template leaves here (1.77.2) was a promise nobody checked, kept only
# by clippy refusing standard-library calls the workspace next door uses freely.

[lib]
name = "genethub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
