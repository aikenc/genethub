[workspace]
resolver = "2"
members = [
    "apps/agent",
    "apps/cli",
    "apps/daemon",
    "apps/guest",
    "apps/guest-probe",
    "apps/host",
    "packages/frontdoor",
    "packages/http",
    "packages/identity",
    "packages/native",
    "packages/wasi-guest",
    "packages/proto",
    "testing/deprecated/rust",
]
# Frozen integration crate stays a member so `cargo test -p genehub-testing` still
# works by hand. It is not a default member: ordinary `cargo test` does not run it.
# genehub-host pulls Wasmtime; keep it off the default `cargo test` graph.
default-members = [
    "apps/agent",
    "apps/cli",
    "apps/daemon",
    "packages/frontdoor",
    "packages/http",
    "packages/identity",
    "packages/native",
    "packages/proto",
]
# The Tauri shell stays out of the workspace on purpose: it drags in a large,
# slow-to-build native dependency tree that would otherwise be rebuilt whenever
# the daemon changes.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
# Not maintained by hand, and not a claim about any release: the product's version
# is the git tag, which `scripts/version.sh` writes in as the release is built.
# 0.0.0 means "this build was never released", and the daemon says exactly that to
# whoever asks (`update.check`).
#
# The numbers this replaced were kept in step by hand, which is to say they were
# not: they sat at 0.1.0 through seventeen tagged releases while every installed
# copy reported 0.1.0 to its own workbench.
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
json5 = "1.3.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time", "fs", "signal"] }
ts-rs = "10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Local / Dev / Beta Live guest builds. Custom profiles inherit from release
# unless told otherwise — this one must not pick up fat LTO or opt-level="z".
# debug=0 + strip drop the ~200MB DWARF that made load/test crawl; opt-level=1
# keeps unoptimized WASM from being the next bottleneck. Neither is fat LTO.
[profile.iterate]
inherits = "dev"
incremental = true
lto = false
codegen-units = 256
opt-level = 1
debug = 0
strip = true
