[workspace]
resolver = "2"
members = [
  "apps/agent",
  "apps/cli",
  "apps/daemon",
  "packages/daemon-platform",
  "packages/daemon-logic-api",
  "packages/daemon-common",
  "packages/daemon-core",
  "packages/daemon-logic",
  "packages/daemon-artifact",
  "packages/proto",
  "testing",
]
# The Tauri shell stays out of the workspace on purpose: it drags in a large,
# slow-to-build native dependency tree that would otherwise be rebuilt whenever
# the daemon changes.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
# Not maintained by hand, and not a claim about any release: the product's version
# is the git tag, which `scripts/version.sh` writes in as the release is built.
# 0.0.0 means "this build was never released", and the daemon says exactly that to
# whoever asks (`update.check`).
#
# The numbers this replaced were kept in step by hand, which is to say they were
# not: they sat at 0.1.0 through seventeen tagged releases while every installed
# copy reported 0.1.0 to its own workbench.
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
chrono = { version = "0.4", features = ["clock", "serde"] }
ed25519-dalek = "3"
futures-util = "0.3"
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
json5 = "1.3.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time", "fs", "signal"] }
ts-rs = "10"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["anyhow", "runtime", "std", "winch"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p1"] }
wasmparser = "0.252"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The hot-updatable daemon app is not CPU-bound. These profiles deliberately
# optimize edit-to-artifact latency instead of paying the workspace's expensive
# size-oriented full LTO on every logic release.
[profile.daemon-logic-dev]
inherits = "dev"
opt-level = 0
debug = false
strip = "symbols"
incremental = true
codegen-units = 256
panic = "abort"

[profile.daemon-logic-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = "symbols"
incremental = true
panic = "abort"
