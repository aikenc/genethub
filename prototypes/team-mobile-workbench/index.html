if(id==='settings')return `<div class="tool-breadcrumb">全局 / 偏好</div><h3>界面设置</h3><p>手机与桌面共用设置入口。运行配置继续遵循当前 Agent 的能力声明。</p><h3>显示密度</h3><div class="agent-picker">${['紧凑','舒适','放大'].map(v=>`<button data-action="preference" data-id="${v}" class="${uiDensity===v?'active':''}" aria-pressed="${uiDensity===v}">${v}</button>`).join('')}</div><p class="source-label">当前演示偏好：${uiDensity}。正式版使用已有缩放与设置状态。</p>`;

return '';}

function projectView(){const candidate=viewVariant==='candidate';return `<div class="section-pad"><div class="section-eyebrow">项目视图 / 从工作流模板开始</div><div class="view-heading"><div><h2>营地交付看板</h2><p class="section-lead">布局、文案与交互可以随项目改进；执行事实始终来自同一次 Run。</p></div>${badge(candidate?'候选预览 · 未激活':'Run 015 · 已固定','gray')}</div><div class="view-host-bar"><span>${icon('shield',16)} ${candidate?'预览 Candidate，读取 Run 015 的示例事实':'Run 015 · 原生状态：'+(state.blocked?'受阻':'验收中')}</span><button data-action="native-flow">原生执行记录 ${icon('arrow',13)}</button></div><div class="view-controls" aria-label="切换项目展示方案"><button class="${!candidate?'active':''}" data-action="view-mode" data-id="template">Pack 默认视图</button><button class="${candidate?'active':''}" data-action="view-mode" data-id="candidate">WorkflowManager 改版</button></div>${viewFailed?`<div class="view-fallback" role="status">${icon('alert',24)}<h3>项目页面暂时无法显示</h3><p>自定义页面失败不影响 Run。仍可查看上面的原生状态、执行记录和会话。</p><button class="btn" data-action="native-flow">查看原生执行记录</button></div>`:`<section class="project-canvas ${candidate?'board-variant':''}" aria-label="可定制项目页面"><header><small>${candidate?'REVIEW FIRST / 移动验收优先':'MOONCAMP / DELIVERY'}</small><h3>${candidate?'今天，把营地带到手机上':'从想法到可玩的夜晚'}</h3><p>${candidate?'按你的要求突出验收入口，收起实现细节。':'一个可继续调整的项目展示模板。'}</p></header><div class="view-nodes">${(candidate?[...VIEW_FACTS].reverse():VIEW_FACTS).map(n=>`<article><div>${badge(n.node==='review'&&state.blocked?'受阻':n.status,n.node==='review'?'wait':'gray')}<span>${n.worker}</span></div><h3>${n.name}</h3><p>${n.node==='review'?'390px 触屏 · 昼夜切换 · 证据待返回':'实现结果与检查记录已接收'}</p><button data-action="session" data-id="${n.id}">查看执行会话 ${icon('arrow',13)}</button></article>`).join('')}</div><button class="btn" data-action="artifact" data-id="camp-file">${icon('play',14)} 打开关联文件</button></section>`}<div class="view-controls secondary"><button data-action="view-draft">把改版要求带给 WorkflowManager</button><button data-action="view-failure">${viewFailed?'恢复项目页面':'模拟页面失败'}</button></div><details class="evidence"><summary>这个页面来自哪里？</summary><pre>拟议项目文件：.genethub/workflow/views/overview/index.html\n默认内容：由 Pack 提供并复制到项目\n修改者：用户引导下的 WorkflowManager\n展示绑定：${candidate?'Candidate draft-02（未激活）':'Run 015 的固定快照'}\n执行数据：相同 Run 015，没有随布局重新生成\n此处是静态原型；HTML 数据桥与版本绑定尚未实现。</pre></details></div>`;}

let state=restore(),activeModal=null,modalOrigin=null,returnTrail=[],toastTimer=null,lastPhase='',newAgent='Genet',newSpace='notes';
const $=selector=>document.querySelector(selector);
const machineName=()=>state.machine==='studio'?'创作工作站':'随身笔记本';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({...state,offline:false,blocked:false,version:2}));}catch{/* Preview storage may be unavailable; this page remains usable in memory. */}}
function phase(){if(state.offline&&state.offlinePhase)return state.offlinePhase;if(!state.decision)return'pending';if(state.decision.value!=='approved')return state.decision.value;const age=Date.now()-state.decision.at;return age<650?'submitting':age<4500?'queued':age<9500?'initializing':'done';}
function spaces(){const list=BASE_SPACES.map(w=>w.id==='orbit'&&phase()==='done'?{...w,component:'PM',kind:'pm'}:w);if(phase()==='done'){for(const w of BASE_SPACES.filter(s=>s.parent)){list.push({...w,id:w.id.replace('camp','orbit'),parent:w.parent.replace('camp','orbit'),path:w.path.replace('mooncamp','startrail')});}}return list;}
function sessions(){return [...BASE_SESSIONS,...state.extra].map(s=>s.id==='launch'?{...s,stateLabel:({submitting:'提交中',queued:'等待调度',initializing:'执行中',done:'已完成',expired:'已过期',rejected:'已拒绝'})[phase()],status:phase()==='pending'?'waiting':['submitting','queued'].includes(phase())?'waiting':phase()==='initializing'?'running':'idle',snippet:({pending:'等你确认：为星轨建立项目团队',submitting:'正在提交你的决定',queued:'已批准，等待调度',initializing:'新回合正在创建项目团队',done:'团队已创建，可以继续最初的目标',rejected:'已拒绝，本次计划没有执行',expired:'请求已过期，需要重新生成计划'})[phase()]}:state.blocked&&['pm','exec','reviewer'].includes(s.id)?{...s,status:'failed',snippet:'验收受阻：手机点击范围检查未通过'}:s);}
const workspace=id=>spaces().find(w=>w.id===id)||spaces()[0];
const session=()=>sessions().find(s=>s.id===state.sid)||sessions()[0];
function visibleSession(s){return !s.id.startsWith('draft-')||(Array.isArray(state.messages[s.id])&&state.messages[s.id].length>0);}
function currentSessions(){return sessions().filter(s=>workspace(s.space).machine===state.machine&&visibleSession(s));}
function pendingCount(){return state.machine==='studio'&&phase()==='pending'?1:0;}
const avatar=(s,cls='')=>`<span class="avatar ${s.kind||'normal'} ${cls}">${escapeHTML(s.mark||'G')}</span>`;
const statusText=status=>({running:'进行中',waiting:'等你确认',idle:'空闲',draft:'草稿',failed:'受阻'})[status]||status;
const badge=(text,tone='')=>`<span class="pill ${tone}">${escapeHTML(text)}</span>`;
function toast(message){$('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3000);}
function saveScroll(){const pane=$('.content-scroll');if(pane)state.scroll[`${state.sid}/${state.tab}/${state.section}`]=pane.scrollTop;}
function route(){return{machine:state.machine,section:state.section,sid:state.sid,space:state.space,showDetail:state.showDetail,tab:state.tab};}
function navigate(next,remember=true){saveScroll();if(remember){returnTrail.push(route());if(returnTrail.length>30)returnTrail.shift();try{history.pushState({genehubPrototype:true,route:{...route(),...next}},'');}catch{}}Object.assign(state,next);state.query='';persist();render();}
function openSession(id){const s=sessions().find(s=>s.id===id);if(!s)return;navigate({sid:id,space:s.space,showDetail:true,tab:'flow'});}
function back(){const previous=returnTrail.pop();if(previous)navigate(previous,false);else navigate({showDetail:false},false);}
function navSection(section){navigate({section,showDetail:false,tab:'flow'});}
function setTab(tab){saveScroll();state.tab=tab;persist();render();}
function render(){const p=phase();lastPhase=p;$('#connectionToggle').textContent=state.offline?'恢复连接':'模拟断线';$('#app').innerHTML=`<div class="shell" data-detail="${state.showDetail}">${renderRail()}${renderList()}${renderDetail()}${renderCompanion()}</div>`;const pane=$('.content-scroll');if(pane)pane.scrollTop=state.scroll[`${state.sid}/${state.tab}/${state.section}`]||0;if(activeModal)$('#app').inert=true;}
function renderRail(){return `<aside class="rail"><div class="brand" aria-label="GeneHub">${logo}</div><nav class="main-nav" aria-label="主要导航">${[['sessions','chat','会话'],['inbox','inbox','待确认'],['spaces','spaces','空间'],['tools','tools','工具']].map(([id,i,label])=>`<button type="button" class="nav-item ${state.section===id?'active':''}" data-action="${id==='tools'?'tools':'nav'}" data-id="${id}" aria-current="${state.section===id?'page':'false'}"><span class="nav-icon">${icon(i,21)}</span><span>${label}</span>${id==='inbox'&&pendingCount()?`<span class="badge">${pendingCount()}</span>`:''}</button>`).join('')}</nav><div class="rail-foot"><span class="rail-dot"></span><button class="profile" data-action="about" aria-label="原型设计说明">我</button></div></aside>`;}
function machineButton(){return `<button class="machine-switch" data-action="machines" aria-label="切换目标机器，当前${machineName()}"><span class="machine-symbol">${icon('monitor',17)}</span><span class="machine-copy"><strong>${machineName()}</strong><small><span class="live-dot ${state.offline?'offline':''}"></span>${state.offline?'连接中断 · 显示最后快照':'已连接 · 你的机器'}</small></span>${icon('down',13)}</button>`;}
function renderList(){const name={sessions:'会话',inbox:'待确认',spaces:'工作空间'}[state.section];return `<section class="list-pane" aria-label="${name}列表">${machineButton()}<div class="list-heading"><h1>${name}</h1><button class="icon-btn" data-action="new" aria-label="新建会话">${icon('plus',21)}</button></div>${state.section==='sessions'?`<label class="search-box">${icon('search',16)}<input id="search" value="${escapeHTML(state.query)}" maxlength="100" placeholder="搜索这台机器上的会话" aria-label="搜索会话"></label><div class="list-filters">${[['all','全部'],['running','进行中'],['failed','受阻']].map(([v,l])=>`<button class="${state.filter===v?'active':''}" data-action="filter" data-id="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join('')}</div>`:''}<div class="list-scroll">${listContent()}</div><div class="list-foot">${state.section==='sessions'?'普通与受管会话均在这里 · 仅当前机器':state.section==='spaces'?'展开查看归属 · 选择空间查看其会话':'每个决定都保留在它的原会话中'}</div></section>`;}
function listContent(){if(state.section==='inbox')return pendingCount()?`<div class="list-caption">需要你的判断 <span>1</span></div><button class="pending-card" data-action="session" data-id="launch"><div class="eyebrow">${icon('shield',13)} 星轨 · 项目接管</div><h3>建立这个项目的<br>Agent 团队？</h3><p>创建 4 个子 Space，准备交付流程。你的决定将保留在原会话中。</p><div class="bottom">查看计划与上下文 ${icon('arrow',16)}</div></button><div class="space-list-note">Agent 已结束当前执行，等待你的决定。你可以稍后回来。</div>`:`<div class="empty"><span class="empty-icon">${icon('check',26)}</span><h2>暂时没有待确认</h2><p>${state.machine==='studio'?'已处理的决定可以在「星轨」原会话中查看。':'这台笔记本上没有等待你的请求。'}</p>${state.machine==='studio'?'<button class="btn" data-action="session" data-id="launch">查看原会话</button>':''}</div>`;if(state.section==='spaces')return `<div class="list-caption">${machineName()} <span>${spaces().filter(w=>w.machine===state.machine).length} 个空间</span></div>${renderTree(null)}`;const list=currentSessions().filter(s=>(state.filter==='all'||s.status===state.filter)&&(`${s.title} ${workspace(s.space).name} ${s.role}`).toLowerCase().includes(state.query.toLowerCase()));return `<div class="list-caption">最近的工作 <span>${list.length} 个会话</span></div>${list.map(row).join('')||'<div class="empty"><p>没有符合条件的会话。换个关键词或筛选试试。</p></div>'}`;}
function row(s){return `<button class="session-row ${s.id===state.sid?'selected':''}" data-action="session" data-id="${escapeHTML(s.id)}" aria-label="打开会话：${escapeHTML(s.title)}">${avatar(s)}<span class="row-body"><span class="session-title">${escapeHTML(s.title)}</span><span class="row-meta"><span class="grow">${escapeHTML(workspace(s.space).name)}${s.role?' · '+escapeHTML(s.role):''}${s.managed?' · 受管':''}</span><span class="state-dot ${s.status}" aria-label="${(s.stateLabel||statusText(s.status))}"></span></span><span class="row-snippet">${escapeHTML(s.snippet)}</span></span></button>`;}
function renderTree(parent){const list=spaces().filter(w=>w.parent===parent&&w.machine===state.machine);return `<ul class="space-tree">${list.map(w=>{const has=spaces().some(c=>c.parent===w.id),expanded=state.expanded.includes(w.id);return `<li><div class="space-item ${state.space===w.id?'selected':''}">${has?`<button class="tree-toggle" data-action="expand" data-id="${w.id}" aria-label="${expanded?'收起':'展开'}${escapeHTML(w.name)}" aria-expanded="${expanded}">${icon(expanded?'down':'chevron',13)}</button>`:'<span class="tree-toggle empty"></span>'}<button class="space-name" data-action="space" data-id="${w.id}">${avatar(w)}<span class="space-copy"><strong>${escapeHTML(w.name)}</strong><small>${escapeHTML(w.component)}</small></span></button></div>${has&&expanded?renderTree(w.id):''}</li>`}).join('')}</ul>`;}
function renderDetail(){if(state.section==='spaces')return renderWorkspacePage();const s=session();const pending=s.id==='launch'&&phase()==='pending';return `<main class="detail" aria-label="会话主面板"><header class="detail-head"><button class="icon-btn back" data-action="back" aria-label="返回列表或上一会话">${icon('back',20)}</button>${avatar(s)}<div class="head-copy"><h1>${escapeHTML(s.title)}</h1><p><span class="machine-inline">${machineName()}</span><span class="machine-inline">/</span><span>${escapeHTML(workspace(s.space).name)}</span><span>·</span><span>${escapeHTML(s.role||s.agent)}</span>${s.role&&s.agent?`<span class="desktop-path">· ${escapeHTML(s.agent)}</span>`:''}</p></div><div class="head-actions"><button class="icon-btn optional mobile-hide" data-action="tools" aria-label="工作区与全局工具">${icon('tools',18)}</button><button class="icon-btn mobile-hide" data-action="details" data-id="${s.space}" aria-label="工作空间详情">${icon('info',18)}</button><button class="icon-btn" data-action="session-menu" aria-label="会话操作">${icon('more',21)}</button></div></header>${state.offline?offlineBanner():''}<nav class="detail-tabs" aria-label="会话内容视图">${[['flow','信息流'],['artifacts','文件'],...(s.space.startsWith('camp')?[['project','项目视图']]:[]),['team','空间']].map(([id,label])=>`<button class="${state.tab===id?'active':''}" data-action="tab" data-id="${id}" aria-pressed="${state.tab===id}">${label}${id==='artifacts'&&s.space.startsWith('camp')?'<span class="tab-count">1</span>':''}</button>`).join('')}<span class="right"><span class="state-dot ${s.status}"></span><span>${state.offline?'未同步':(s.stateLabel||statusText(s.status))}</span></span></nav><div class="content-scroll" tabindex="-1">${state.tab==='flow'?renderFeed(s):state.tab==='artifacts'?renderArtifacts(s):state.tab==='project'?projectView():renderTeam(s)}</div>${state.tab==='flow'?pending?approvalDock():renderComposer(s):''}</main>`;}
function offlineBanner(){return `<div class="offline-banner">${icon('wifi',15)}<span>连接已中断 · 当前为最后同步的内容</span><button data-action="reconnect">重新连接</button></div>`;}
function by(name,kind,mark,time){return `<div class="message-by">${avatar({kind,mark})}<span>${name}</span><time>${time}</time></div>`;}
function message(name,kind,mark,time,text,human=false){return `<article class="message ${human?'human':''}">${by(name,kind,mark,time)}<div class="message-text">${text}</div></article>`;}
function renderFeed(s){let content='';if(s.id==='pm')content=pmFeed();else if(s.id==='exec')return executorFeed();else if(s.id==='launch')content=approvalFeed();else if(s.id==='wm')content=wmFeed();else if(s.managed)content=workerFeed(s);else content=ordinaryFeed(s);const sent=Array.isArray(state.messages[s.id])?state.messages[s.id].slice(-12):[];return `<div class="feed"><div class="date-divider">今天 · 9 月 5 日</div>${content}${sent.map(m=>message('你','normal','我','刚刚',escapeHTML(String(m).slice(0,2000)).replace(/\n/g,'<br>'),true)).join('')}${sent.length?'<div class="sending-note">本页仅演示消息呈现，未调用真实 Agent。</div>':''}</div>`;}
function pmFeed(){return `${message('你','normal','我','10:24','给营地加上昼夜和萤火虫，手机上也能玩。保留当前可玩版本。',true)}<article class="message">${by('PM','pm','P','10:24')}<div class="message-text">沿用现有团队：<strong>先实现，再验收手机操作。</strong>当前可玩版本会保留。</div>${runCard()}<div class="message-text">上一版的营地也在这里，你可以边等边看看。</div>${artifactTile()}<div class="info-line">${icon('flow',13)}${state.blocked?'当前验收受阻，执行详情里保留了检查结果。':'流程由 Executor 推进，当前正在等待 Reviewer 的验收结果。'}</div></article>`;}
function runCard(){return `<section class="run-card" aria-label="昼夜循环的运行摘要"><header class="run-card-head">${icon('flow',15)}<strong>昼夜循环与萤火虫</strong>${badge(state.blocked?'验收受阻':'验收中',state.blocked?'red':'')}</header><p class="run-title">${state.blocked?'触屏点击范围需要调整':'实现已交付，进入触屏验收'}</p><p class="run-desc">${state.blocked?'390px 视口下的点击区域检查未通过。':'Coder 已交出结果；Reviewer 检查昼夜切换与触屏操作。'}</p><div class="steps"><div class="step done"><div class="step-line"></div><span class="step-label">${icon('check',11)} 接收目标</span></div><div class="step done"><div class="step-line"></div><span class="step-label">${icon('check',11)} 实现玩法</span></div><div class="step current"><div class="step-line"></div><span class="step-label">${icon(state.blocked?'alert':'clock',11)} 交付验收</span></div></div><footer class="card-footer"><span>流程记录 · 最后同步 10:28</span><button data-action="session" data-id="exec">查看执行 ${icon('arrow',14)}</button></footer></section>`;}
function artifactTile(ref=resourceFor(session())){return `<button class="result-tile" data-action="artifact" data-id="${ref.id}"><span class="result-thumb">${ref.id==='camp-file'?sceneSVG(false):`<span class="document-thumb">${icon('file',27)}</span>`}</span><span><strong>${escapeHTML(ref.title)}</strong><small>${escapeHTML(ref.path)}<br>来自${escapeHTML(workspace(ref.space).name)}的文件引用</small></span><span class="round-icon">${icon('play',12)}</span></button>`;}
function executorFeed(){const ev=(time,title,body,worker,detail)=>`<li class="flow-event"><span class="flow-pin">${icon('check',12)}</span><header>${title}<time>${time}</time></header><p>${body}</p>${worker?`<button data-action="session" data-id="${worker}">查看 ${worker==='coder'?'Coder':'Reviewer'} 会话 ${icon('arrow',13)}</button>`:''}${detail?`<details class="evidence"><summary>结果与证据</summary><pre>${escapeHTML(detail)}</pre></details>`:''}</li>`;return `<div class="section-pad"><div class="section-eyebrow">EXECUTOR / 流程信息流</div><div class="flow-top ${state.blocked?'failed':''}"><div>${icon(state.blocked?'alert':'flow',21)}</div><div><h2>${state.blocked?'当前状态：验收受阻':'当前状态：等待 Reviewer 输出'}</h2><p>${state.blocked?'触屏点击区域检查未通过。该状态来自当前 Run 快照。':'已完成实现，验收节点已派发。最近的执行记录更新于 10:28。'}</p></div>${badge(state.blocked?'受阻':'进行中',state.blocked?'red':'')}</div><ol class="flow-log" aria-label="执行消息">${ev('10:24','收到执行任务','PM 提交目标：昼夜循环、萤火虫与触屏操作。',null,'kind: run.requested\nworkflow: game-feature\nrun: demo-run-015\nsnapshot: 本次运行启动时固定')}${ev('10:24','派发实现节点','Executor → 玩法开发 · Coder','coder')}${ev('10:27','实现节点完成','已接受 Worker 返回的实现与检查证据。','coder','kind: node.completed\nnode: implement\naccepted: true\nfile: builds/v0.3/index.html\nchecks: day-night, fireflies')}${ev('10:28','派发验收节点','Executor → 质量与验收 · Reviewer','reviewer')}</ol><div class="note">${state.blocked?'最近状态显示验收受阻；历史消息中没有对应失败事件，因此不补造一条流程消息。':'最后同步 10:28。验收结果尚未返回，安静不代表执行崩溃。'}</div><details class="evidence"><summary>关联、快照与消息来源</summary><pre>来源：session.flow 的结构示例\nRun 与 Executor Session 一一绑定\n历史消息按持久账本顺序显示\n当前节点与 evidence 来自 Run 快照\n此页为模拟数据，并未请求真实 daemon</pre></details><button class="btn" style="margin-top:20px" data-action="session" data-id="pm">${icon('back',14)} 返回 PM 会话</button></div>`;}
function approvalFeed(){const p=phase();return `${message('你','normal','我','10:20','做一个太空躲避小游戏，用这个空目录开始。请建立一个能把它交付出来的团队。',true)}<article class="message">${by('Cursor','orbit','S','10:21')}<div class="message-text">我已生成星轨项目的接管计划。确认后会在这台工作站上建立团队，继续你刚才的目标。</div><div class="plan-card"><div class="plan-scope">${icon('monitor',13)} 创作工作站 <span> / </span> 星轨</div><h3>为星轨建立项目团队</h3><p>计划已保存。等待你决定期间，Agent 不保持运行。</p><ul class="plan-list"><li><span class="num">1</span><span>将当前普通 Space 配置为 PM 项目。</span></li><li><span class="num">2</span><span>创建 Executor、Coder、Reviewer、WorkflowManager 四个子 Space。</span></li><li><span class="num">3</span><span>写入项目交付流程和团队 Skill。</span></li><li><span class="num">4</span><span>在 <span class="mono">~/Projects/startrail</span> 建立本地 Git 仓库。</span></li></ul><details class="evidence"><summary>查看本次计划的范围</summary><pre>目标机器：创作工作站\n工作空间：星轨（当前为空目录）\n范围：本地项目与团队配置\n授权：仅本次计划，一次使用\n不包含外部发布\n演示请求：demo-approval-startrail\n原型展示建议团队关系，实际 Pack 迁移见设计说明</pre></details></div></article>${p!=='pending'?message('决定记录','normal','我','刚刚',p==='rejected'?'你拒绝了这次计划。项目保持原样，Agent 没有继续执行。':p==='expired'?'这份计划已过期。请回到原会话重新规划后再确认。':p==='done'?'你的一次批准已被记录。新回合已完成团队初始化，可以继续最初的小游戏目标。':'你的一次批准正在被处理。决定和后续执行分开显示。'):''}`;}
function approvalDock(){return `<section class="approval-dock" aria-label="待确认的项目计划"><strong>为星轨建立项目团队</strong><p>${state.offline?'连接中断，请重新连接并核实计划后再决定。':'本次计划的一次授权 · 决定会保留在原会话'}</p><div class="approval-actions"><button class="btn" data-action="reject" ${state.offline?'disabled':''}>拒绝</button><button class="btn primary" data-action="approve" ${state.offline?'disabled':''}>${icon('shield',15)} 一次批准并继续</button></div></section>`;}
function workerFeed(s){return `${message('节点任务','exec','E','10:24',s.id==='coder'?'在当前项目中实现昼夜循环与萤火虫。交付实现及可复核的检查结果。':'核验昼夜切换、萤火虫和触屏移动。记录检查结果与证据。')}<article class="message">${by(s.agent,s.kind,s.mark,'10:27')}<div class="message-text">${s.id==='coder'?'已完成昼夜循环与场景粒子。触屏沿用点击移动，接下来把实现与检查结果交回 Executor。':state.blocked?'发现一个需要修正的问题：390px 视口下，操作区的点击范围小于设计目标。检查结果已保留。':'正在检查 390px 下的点击移动与昼夜切换，接下来会把验收结果交回 Executor。'}</div><details class="evidence"><summary>${icon('code',13)} ${s.id==='coder'?'实现与检查结果':'浏览器检查记录'}</summary><pre>${s.id==='coder'?'修改：scene-cycle.ts、fireflies.ts\n检查：昼夜切换、粒子随夜晚出现\n结果：已交回实现节点':state.blocked?'viewport: 390 × 844\ntouch target: 32 × 32\nexpected: at least 44 × 44\n当前 Run 状态：受阻':'viewport: 390 × 844\n正在检查：昼夜切换、点击移动\n尚未提交最终结论'}\n以上为原型样例</pre></details></article>`;}
function wmFeed(){return `<div class="view-invitation"><span>项目视图也可以随工作流一起改进</span><button data-action="tab" data-id="project">预览展示候选 ${icon('arrow',13)}</button></div>${message('你','normal','我','09:50','分析最近两次交付，看看验收阶段有什么可以改进的。先给我候选，不要直接激活。',true)}<article class="message">${by('WorkflowManager','wm','W','10:02')}<div class="message-text">两次运行里，手机布局问题都到了最终验收才暴露。建议在实现完成时，先做一轮轻量的触屏检查。</div><div class="candidate"><header>${icon('flow',17)}<h3>更早检查移动端交互</h3>${badge('未激活','wait')}</header><div class="candidate-body">依据：Run 014、015 的节点结果与验收记录。<div class="comparison"><div><small>当前流程</small><p>实现 → 最终验收<br>最后发现手机布局问题</p></div><div><small>候选流程</small><p>实现时加入触屏检查<br>最终验收复核整体体验</p></div></div><details class="evidence"><summary>查看评估与变更范围</summary><pre>Candidate：demo-mobile-check-02\n结构检查：通过\n角色解析：沿用已有 Coder / Reviewer\n历史事实检查：2 次 Run 的结果可读取\n预期收益：更早暴露手机交互问题（尚未量化）\n当前激活版本：保持不变\n在途 Run：保持原快照\n状态：inert / 未激活\n此处是演示评估，不是真实性能测试</pre></details></div></div><div class="info-line">${icon('shield',14)} 评估通过不代表激活。当前运行继续使用原来的流程。</div></article>`;}
function ordinaryFeedText(s){if(s.id.startsWith('draft-')&&!(state.messages[s.id]||[]).length)return `<div class="empty"><span class="empty-icon">${icon('chat',25)}</span><h2>从一个想法开始</h2><p>${escapeHTML(workspace(s.space).name)} · ${escapeHTML(s.agent)}<br>说说你想做什么。发送之前，这只是一个草稿。</p></div>`;if(s.id==='travel')return `${message('你','normal','我','昨天','把周末湖边徒步的路线整理一下，轻松一点，留出拍照的时间。',true)}${message('Genet','normal','T','昨天','可以沿湖走一条短环线，把上午留给步行，下午在观景点停留。这份手记属于随身笔记本，与工作站上的项目分开。')}`;if(s.id==='ordinary')return `${message('你','normal','我','昨天','手机上工具栏有点挤，先分析现有输入区和键盘的关系。',true)}${message('Cursor','normal','L','昨天','输入区应保持稳定高度，只随草稿内容增长。工具入口按需打开；键盘出现时，让底部操作区移到可见位置，不推走整个页面。')}`;return `${message('你','normal','我','10:10','把本周阅读的三个想法整理一下：人的注意力、长任务的等待，以及如何给创作留出空间。',true)}${message(s.agent,'normal','N','10:11','我把它们整理成了一个讨论提纲。<br><br><strong>人的注意力</strong>：重要的判断应出现在合适的时机。<br><strong>长任务的等待</strong>：离开屏幕后，工作仍然可以继续。<br><strong>创作的空间</strong>：把琐碎操作交出去，让人回到作品本身。<br><br>你想先展开哪一个？')}`;}
function ordinaryFeed(s){return ordinaryFeedText(s)+(s.id.startsWith('draft-')?'':`<details class="evidence ordinary-process"><summary>${icon('check',14)} 工作过程 · 读取 2 个文件，完成 1 次修改</summary><div class="tool-detail"><strong>read</strong><span>已完成 · 0.2 秒</span><code>README.md</code><strong>bash</strong><span>已完成 · exit 0</span><code>检查工作空间内的文件</code></div><details class="evidence"><summary>原始工具详情</summary><pre>{ "name": "read", "status": "completed", "path": "README.md" }\n示例帧；正式版沿用现有 TimelineView / WorkTrunk 与工具渲染器。</pre></details></details>${artifactTile(resourceFor(s))}`);}
function renderComposer(s){const p=phase();if(s.id==='launch'&&['submitting','queued','initializing'].includes(p))return `<div class="decision-banner" role="status">${icon(p==='initializing'?'flow':'clock',19)}<div>${state.offline?'决定状态尚未同步':{submitting:'正在提交你的决定…',queued:'已批准，等待调度',initializing:'新执行回合已启动'}[p]}<span>${state.offline?'重新连接后核对结果；不会再次批准。':p==='queued'?'原会话会由新回合继续，你可以离开页面。':p==='initializing'?'正在创建项目团队。':'等待保存完成的确认。'}</span></div></div>`;if(s.managed||s.kind==='exec')return `<div class="readonly-bar">${icon('lock',16)}<p>${s.managed?'这是受管工作会话，可以查看执行与证据。':'可以查看执行与结果；如需调整目标，请回到 PM。'}</p><button data-action="session" data-id="${s.managed?'exec':'pm'}">${s.managed?'返回 Executor':'回到 PM'} ${icon('arrow',12)}</button></div>`;return `<section class="composer" aria-label="消息输入区"><div class="composer-box"><label class="sr" for="draft">消息草稿</label><textarea id="draft" rows="1" maxlength="2000" placeholder="${state.offline?'连接中断，可以先保存草稿…':s.id==='launch'&&p==='expired'?'请重新生成接管计划…':'继续讨论，或提出一个新想法…'}">${escapeHTML(state.drafts[s.id]||'')}</textarea><div class="composer-tools"><button data-action="context" aria-label="查看当前会话上下文">${icon('plus',17)}</button><button data-action="agent-info">${escapeHTML(s.agent||'Genet')} ${icon('down',11)}</button><button data-action="details" data-id="${s.space}">${icon('spaces',12)} ${escapeHTML(workspace(s.space).name)}</button><button class="send" data-action="send" aria-label="发送消息" ${state.offline||!(state.drafts[s.id]||'').trim()?'disabled':''}>${icon('send',17)}</button></div></div><div class="composer-hint">${s.role==='PM'?'目标与判断留在这里，执行由团队继续。':'普通会话 · 从你的想法继续'}</div></section>`;}
function renderArtifacts(s){const ref=resourceFor(s);return `<div class="section-pad"><div class="section-eyebrow">工作空间 / 文件与预览</div><h2>${escapeHTML(workspace(s.space).name)}的文件</h2><p class="section-lead">从信息流里的文件链接、文件树或最近打开记录进入。任何普通工作空间都可以使用。</p>${artifactTile(ref)}<div class="public-file-note">${icon('file',16)} ${escapeHTML(ref.path)}<br>当前文件指纹：${ref.version} · 演示标识<br>这是项目文件，不代表 GeneHub 已保存历史版本。</div><button class="btn" data-action="tools-file">${icon('spaces',16)} 浏览这个空间的文件</button><div class="note" style="margin-top:20px">预览、截图与反馈跟随文件所在机器和空间；不要求 PM、团队或 Run。</div></div>`;}
function feedbackBox(inModal=false){const ref=previewRef||resourceFor(session());const value=state.resourceFeedback?.[ref.id]||'';const targets=feedbackSessions(ref);const selected=state.feedbackTargets?.[ref.id]||ref.origin;return `<div class="artifact-feedback"><label for="feedback-modal">看过之后，想调整什么？</label><textarea id="feedback-modal" class="feedback-input" maxlength="2000" placeholder="描述你看到的问题或想尝试的变化…">${escapeHTML(value)}</textarea><label class="target-label" for="feedback-target">带入哪个会话的草稿</label><select id="feedback-target">${targets.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${escapeHTML(workspace(x.space).name)} / ${escapeHTML(x.title)}</option>`).join('')}</select><div class="feedback-foot"><p>附文件路径、机器和本次观察到的版本。<br>写入草稿后，由你检查并发送。</p><button class="btn primary" data-action="feedback" ${!value.trim()||!targets.length?'disabled':''}>带入会话草稿 ${icon('arrow',14)}</button></div><p class="source-label">受管只读会话不能接收新指令。正式版沿用现有预览截图、日志采集与反馈入口。</p></div>`;}
function renderTeam(s){if(!s.space.startsWith('camp'))return `<div class="section-pad">${workspaceContext(workspace(s.space))}</div>`;return `<div class="section-pad"><div class="section-eyebrow">微光营地 / 协作关系</div><h2>目标、方法与执行</h2><p class="section-lead">从这次工作进入团队，也随时可以回到信息流。</p>${teamMember('pm','项目管理','管理目标、预算与最终交付')}<div class="team-branch">${teamMember('wm','工作流改进','分析运行事实，形成待评估 Candidate')}${teamMember('exec','流程执行','按固定流程派发节点与接受结果')}<div class="team-branch">${teamMember('coder','玩法开发','实现本次节点，提交工作证据')}${teamMember('reviewer','质量与验收','核验产物并提交验收结论')}</div></div><div class="note">原型采用建议拓扑：WorkflowManager 与 Executor 同级。当前 Pack 尚需合同调整与受控迁移，详情见设计说明。</div><button class="btn" data-action="details" data-id="${s.space}">${icon('spaces',15)} 当前 Space 详情</button></div>`;}
function teamMember(id,title,description){const s=sessions().find(x=>x.id===id);return `<button class="team-member" data-action="session" data-id="${id}">${avatar(s)}<span class="grow"><strong>${title}</strong><p>${escapeHTML(s.role)} · ${description}</p></span>${icon('chevron',14)}</button>`;}
function renderWorkspacePage(){const w=workspace(state.space);return `<main class="detail" aria-label="空间主面板"><header class="detail-head"><button class="icon-btn back" data-action="back" aria-label="返回空间列表">${icon('back',20)}</button>${avatar(w)}<div class="head-copy"><h1>${escapeHTML(w.name)}</h1><p>${machineName()} · 工作空间</p></div><button class="icon-btn" data-action="tools" aria-label="工作区与全局工具">${icon('tools',18)}</button><button class="icon-btn" data-action="details" data-id="${w.id}" aria-label="全局空间详情">${icon('more',20)}</button></header>${state.offline?offlineBanner():''}<div class="content-scroll"><div class="section-pad">${workspaceContext(w)}<div class="list-caption" style="padding-left:0;margin-top:20px">这个空间里的会话</div>${sessions().filter(s=>s.space===w.id&&visibleSession(s)).map(s=>`<button class="wide-row" data-action="space-session" data-id="${s.id}">${avatar(s)}<span class="grow"><strong>${escapeHTML(s.title)}</strong><p>${escapeHTML(s.role||s.agent)} · ${(s.stateLabel||statusText(s.status))}</p></span>${icon('chevron',15)}</button>`).join('')||'<div class="note">还没有会话。首次发送消息后才创建会话记录。</div>'}</div></div></main>`;}
function workspaceContext(w){return `<div class="workspace-hero">${avatar(w)}<div><h2>${escapeHTML(w.name)}</h2><p>${escapeHTML(w.component)}</p></div></div><p class="section-lead">${w.id.startsWith('camp')?'这个空间承担团队的一部分工作。打开它的会话，查看对应的进度和结果。':'可以直接讨论、整理资料，或者给 Agent 一个目标。会话和文件都留在这台机器上。'}</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" data-action="new" data-id="${w.id}">${icon('plus',15)} 新会话</button><button class="btn" data-action="details" data-id="${w.id}">${icon('info',15)} 空间详情</button></div><dl class="key-value"><dt>机器</dt><dd>${machineName()}</dd><dt>位置</dt><dd class="mono">${escapeHTML(w.path)}</dd><dt>Parent</dt><dd>${w.parent?escapeHTML(workspace(w.parent).name):'根空间'}</dd></dl>`;}
function renderCompanion(){const s=session();const contextSpace=workspace(state.section==='spaces'?state.space:s.space);const isCamp=contextSpace.id.startsWith('camp')&&state.machine==='studio';return `<aside class="companion" aria-label="当前上下文"><div class="aside-title"><span>${isCamp?'当前工作':'工作上下文'}</span><button data-action="details" data-id="${state.section==='spaces'?state.space:s.space}" aria-label="展开空间详情">${icon('info',15)}</button></div><h2 class="brief-title">${isCamp?'给夜晚一点<br>新的生命力':escapeHTML(workspace(state.section==='spaces'?state.space:s.space).name)}</h2><p class="brief-text">${isCamp?'沿用现有营地，添加昼夜和萤火虫。<br>让手机上的片刻空闲，也能走进作品。':'普通会话也可以打开文件、预览页面，再把反馈带回草稿。工具菜单始终保留。'}</p>${isCamp?`<div class="mini-metrics"><div class="mini-metric"><strong>2 <span style="font-size:12px;color:#98a88a">/ 3</span></strong><small>已完成步骤</small></div><div class="mini-metric"><strong>v0.2</strong><small>项目自建版本目录</small></div></div><div class="aside-divider"></div><div class="aside-title">本次协作</div><div class="team-stack">${['pm','exec','coder','reviewer'].map(id=>avatar(sessions().find(x=>x.id===id))).join('')}<button data-action="tab" data-id="team">查看 ${icon('chevron',10)}</button></div><div class="team-line"><span>玩法开发</span><small>已交付</small></div><div class="team-line"><span>质量与验收</span>${badge(state.blocked?'受阻':'正在检查',state.blocked?'red':'')}</div><div class="aside-divider"></div><div class="aside-title">随时看看作品</div><button class="mini-scene" data-action="artifact">${sceneSVG(false)}<span class="scene-caption">${icon('play',12)} 打开微光营地 ${icon('arrow',12)}</span></button>`:''}<div class="aside-foot"><strong>${icon('monitor',13)} ${machineName()}</strong>工作在你的设备上继续。<br>这里只展示当前机器的内容。</div></aside>`;}
function sceneSVG(interactive){const day=state.scene==='day',x=interactive?state.character*4.8:254;const stars=Array.from({length:28},(_,i)=>`<circle cx="${(i*83+21)%480}" cy="${(i*43+19)%133}" r="${i%5===0?1.8:.9}" fill="#d2dfb9" opacity="${day?0:.4+(i%4)*.16}"/>`).join('');return `<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${day?'白天':'夜晚'}的微光营地，山谷中有一顶发光的帐篷"><rect width="480" height="300" fill="${day?'#b8d0b5':'#183942'}"/>${stars}<circle cx="382" cy="67" r="22" fill="${day?'#f3e8b0':'#d9e4c1'}"/>${!day?'<circle cx="391" cy="60" r="21" fill="#183942"/>':''}<path d="m0 159 74-62 70 42 72-78 107 89 70-51 87 52v149H0Z" fill="${day?'#8eb39e':'#23464c'}"/><path d="m0 190 94-44 87 35 90-60 104 63 105-22v138H0Z" fill="${day?'#689c83':'#2b5350'}"/><path d="M0 223q108-52 226-7t254-26v110H0Z" fill="${day?'#618c6a':'#315b4d'}"/><path d="M0 278q116-27 249-19t231-23v64H0Z" fill="${day?'#709065':'#3d6853'}"/><path d="M220 300q-5-25 31-43t37-54" stroke="${day?'#c1b882':'#819075'}" stroke-width="22" fill="none" opacity=".48"/>${[23,58,423,461,115].map((px,i)=>`<g transform="translate(${px} ${i===4?166:138+(i%2)*28})" fill="${day?'#3f725b':'#1c4240'}"><path d="m0 0-22 49h44L0 0Z"/><path d="m0 19-29 50h58L0 19Z"/><path d="m0 36-33 51h66L0 36Z"/><rect x="-3" y="79" width="6" height="20"/></g>`).join('')}<ellipse cx="301" cy="223" rx="61" ry="12" fill="#cfb575" opacity=".12"/><path d="m253 217 43-65 50 65H253Z" fill="#a38653"/><path d="m253 217 43-65 9 65H253Z" fill="#c5a769"/><path d="m276 217 20-45 9 45H276Z" fill="#f3d88a"/><path d="m253 217 43-65 50 65" stroke="#cbb77e" stroke-width="1.5" fill="none"/><path d="m240 222 17-9m91 1 12 11" stroke="#afbc90" stroke-width="1.3"/><g fill="#dbe49e" opacity="${day?.2:1}"><circle cx="191" cy="198" r="1.6"/><circle cx="218" cy="229" r="1.5"/><circle cx="347" cy="232" r="1.5"/><circle cx="318" cy="189" r="1.5"/><circle cx="389" cy="220" r="1.2"/><circle cx="167" cy="241" r="1.2"/></g><g transform="translate(${x} 249)"><ellipse cy="8" rx="9" ry="3" fill="#152d32" opacity=".45"/><path d="M-4 1v8m8-8v8" stroke="#213e3e" stroke-width="3"/><rect x="-6" y="-13" width="12" height="16" rx="5" fill="#e3b272"/><circle cy="-18" r="6" fill="#eed5a2"/><path d="M-7-20a7 7 0 0 1 14 0" fill="#b6694b"/><path d="m5-5 6 4" stroke="#e6c18a" stroke-width="3"/><circle cx="13" cy="2" r="3" fill="#f7df89"/></g></svg>`;}
function sceneView(){return `<div class="scene"><button class="scene-surface" data-action="walk" aria-label="点击营地移动角色；键盘按 Enter 向前移动">${sceneSVG(true)}</button><div class="scene-toolbar"><span class="scene-label">MOONCAMP / v0.2</span><div class="scene-toggle" aria-label="场景昼夜切换"><button data-action="scene" data-id="day" class="${state.scene==='day'?'active':''}" aria-pressed="${state.scene==='day'}">白天</button><button data-action="scene" data-id="night" class="${state.scene==='night'?'active':''}" aria-pressed="${state.scene==='night'}">夜晚</button></div></div><div class="scene-bottom"><span>点击小径，带着灯向前走</span><span>本页绘制的演示场景</span></div></div>`;}
function openModal(type,id){saveScroll();modalOrigin=document.activeElement;activeModal={type,id};renderModal();$('#app').inert=true;const first=$('#overlay button, #overlay input, #overlay textarea');first?.focus();}
function closeModal(){const prior=modalOrigin;activeModal=null;$('#overlay').innerHTML='';$('#app').inert=false;if(prior?.isConnected)prior.focus();else $('.detail-head button, .machine-switch')?.focus();}
function renderModal(){if(!activeModal)return;const {type,id}=activeModal;let title='',body='',footer='',small=false;if(type==='tools'){title='工具';body=toolsMenu();}else if(type==='tool'){title=toolNames[id]||'工具';body=toolPage(id);footer='<button class="btn" data-action="tools-return">'+icon('back',14)+' 返回工具</button>';}else if(type==='about'){title='让协作回到一条清晰的信息流';body=`<p>这是基于当前 GeneHub 工程的下一形态研究。所有业务、文件和授权都是本地演示数据，点击操作不会访问真实项目。</p><h3>三个观察角度，一个持久 Session</h3><ul><li>会话：普通对话与 PM / Executor / Worker 都可以直接进入。</li><li>待确认：只放需要 Human 决定的请求，保留原会话上下文。</li><li>空间：查看归属和会话，不让结构与运行记录共用一个展开动作。</li></ul><h3>可以这样试</h3><p>从 PM 卡进入 Executor，再深入 Worker；从待确认处理星轨的计划，观察排队与执行的区别；从普通会话打开文件预览，选择目标会话带回反馈草稿。顶部可以模拟断线和切换手机宽度。</p><h3>当前实现与提议的边界</h3><p>信息流、受管会话、持久暂停和 Asset Preview 已有工程基础。集中待确认投影、公共文件反馈与项目视图、导航重组需要继续实现。WorkflowManager 在这里采用建议的同级关系，当前 Pack 尚未迁移。</p><p style="margin-top:12px"><a href="README.md">阅读完整工程研究与落地切片</a></p><span class="source-label">基线：合并最新主干后的槽位候选 · 本页静态运行，无模型、授权和后台任务调用</span>`;footer='<button class="btn" data-action="reset-demo">重置演示</button><button class="btn primary" data-action="close-modal">开始体验</button>';}else if(type==='machines'){title='选择目标机器';small=true;body=`<p>先选机器，再看它的空间与会话。不会把两台机器的本地目录混在一起。</p>${[['studio','创作工作站',spaces().filter(w=>w.machine==='studio').length+' 个空间'],['laptop','随身笔记本','1 个空间']].map(([v,n,d])=>`<button class="choose-row ${state.machine===v?'selected':''}" data-action="machine" data-id="${v}"><span class="machine-symbol">${icon('monitor',21)}</span><span class="grow"><strong>${n}</strong><small>${d}</small></span>${state.machine===v?icon('check',18):icon('chevron',16)}</button>`).join('')}<p class="source-label">这两台机器与连接状态均为原型样例。</p>`;}else if(type==='details'){const w=workspace(id||session().space);title=`${w.name} · 空间详情`;body=`<div class="workspace-hero">${avatar(w)}<div><h2>${escapeHTML(w.name)}</h2><p>${escapeHTML(w.component)}</p></div></div><dl class="key-value"><dt>目标机器</dt><dd>${w.machine==='studio'?'创作工作站':'随身笔记本'}</dd><dt>工作位置</dt><dd class="mono">${escapeHTML(w.path)}</dd><dt>Parent</dt><dd>${w.parent?escapeHTML(workspace(w.parent).name):'无 · 根空间'}</dd><dt>健康状态</dt><dd>健康 · 无附加原因</dd><dt>生命周期</dt><dd>${w.id==='camp-wm'?'持久':w.parent?'可复用':'持久'}</dd></dl><h3>Component 与能力</h3><div class="note">${escapeHTML(w.component)}<br>Component 描述能力，当前会话的有效权限仍由 daemon 决定。</div><h3>这个空间里的会话</h3>${sessions().filter(s=>s.space===w.id&&visibleSession(s)).map(s=>`<button class="wide-row" data-action="modal-session" data-id="${s.id}">${avatar(s)}<span class="grow"><strong>${escapeHTML(s.title)}</strong><p>${s.managed?'受管 · 只读':escapeHTML(s.agent||'机械执行')}</p></span>${icon('chevron',14)}</button>`).join('')||'<p>尚无会话。</p>'}${w.id.startsWith('camp')?'<p class="source-label">团队关系为建议拓扑，真实迁移尚未执行。</p>':''}`;footer=`<button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="modal-new" data-id="${w.id}">在这里新建会话</button>`;}else if(type==='artifact'){const ref=previewRef||resourceFor(session());title=ref.title;body=`<div class="preview-location">${escapeHTML(workspace(ref.space).name)} / ${escapeHTML(ref.path)}</div>${ref.id==='camp-file'?sceneView():documentView(ref)}<p class="source-label">${machineName()} · 观察版本 ${ref.version} · 此处为本地交互样例</p>${feedbackBox(true)}`;}else if(type==='new'){title='开始一个会话';small=true;body=`<p>先确认这次工作属于哪里。发送第一条消息之前，不创建会话记录。</p><h3>工作空间</h3><label class="sr" for="new-space">选择工作空间</label><select id="new-space">${spaces().filter(w=>w.machine===state.machine).map(w=>`<option value="${w.id}" ${newSpace===w.id?'selected':''}>${escapeHTML(w.name)} · ${escapeHTML(w.component)}</option>`).join('')}</select><h3>使用哪个 Agent</h3><div class="agent-picker">${['Genet','Codex','Cursor','Claude Code'].map(a=>`<button data-action="choose-agent" data-id="${a}" class="${newAgent===a?'active':''}" aria-pressed="${newAgent===a}">${a}</button>`).join('')}</div>`;footer='<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="create-draft">写下目标 '+icon('arrow',14)+'</button>';}else if(type==='context'){title='当前会话上下文';small=true;body=`<dl class="key-value"><dt>机器</dt><dd>${machineName()}</dd><dt>空间</dt><dd>${escapeHTML(workspace(session().space).name)}</dd><dt>会话</dt><dd>${escapeHTML(session().title)}</dd><dt>文件引用</dt><dd>${session().space.startsWith('camp')?'微光营地 · v0.2':'暂无引用'}</dd></dl><p>发送给当前会话；不会把另一个空间的文件作为当前工作区。</p>`;}else if(type==='agent'){title='当前 Agent';small=true;body=`<h3>${escapeHTML(session().agent||'Executor')}</h3><p>${session().kind==='exec'?'这个执行流由 Component 按固定流程推进，未使用 LLM 生成这些记录。':'Agent 已绑定当前会话。换另一个 Agent 会开始新会话，原有历史保留。'}</p><p class="source-label">正式运行设置继续按 Agent 的能力声明提供，本页不模拟未经声明的模型或权限切换。</p>`;footer='<button class="btn primary" data-action="modal-new" data-id="'+session().space+'">选择 Agent 开始新会话</button>';}else if(type==='session-menu'){title='会话与空间';small=true;body=`<div class="resource-list"><button data-action="tools">${icon('tools',17)} 工作区与全局工具</button><button data-action="change-machine">${icon('monitor',17)} 切换目标机器</button><button data-action="replace-details" data-id="${session().space}">${icon('spaces',17)} 全局空间详情</button><button data-action="context-replace">${icon('info',17)} 查看当前上下文</button>${session().id==='launch'&&phase()==='pending'?'<button data-action="expire">'+icon('clock',17)+' 模拟请求过期</button>':''}<button data-action="back-list">${icon('back',17)} 返回会话列表</button></div>`;}
$('#overlay').innerHTML=`<div class="modal-overlay ${type==='artifact'?'artifact-overlay':''}"><section class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${escapeHTML(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭弹框">${icon('close',20)}</button></header><div class="modal-content">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;}
function refreshScene(){document.querySelectorAll('.scene-surface').forEach(b=>b.innerHTML=sceneSVG(true));document.querySelectorAll('.scene-toggle button').forEach(b=>{const on=b.dataset.id===state.scene;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});persist();}
function beginDraft(spaceId){newSpace=spaceId||state.space||session().space;if(workspace(newSpace).machine!==state.machine)newSpace=spaces().find(w=>w.machine===state.machine).id;newAgent='Genet';openModal('new');}
function createDraft(){const id='draft-'+Date.now();const spaceId=$('#new-space')?.value||newSpace;const s={id,space:spaceId,title:'新会话',agent:newAgent,role:'',kind:'normal',mark:'N',status:'draft',age:'刚刚',snippet:'尚未发送的草稿'};state.extra=state.extra.filter(x=>!(x.id.startsWith('draft-')&&!(state.messages[x.id]||[]).length));state.extra.push(s);closeModal();navigate({section:'sessions',sid:id,space:spaceId,showDetail:true,tab:'flow'});$('#draft')?.focus();}
function send(){const s=session();const text=(state.drafts[s.id]||'').trim().slice(0,2000);if(!text||state.offline||s.managed||s.kind==='exec')return;if(!Array.isArray(state.messages[s.id]))state.messages[s.id]=[];state.messages[s.id].push(text);state.messages[s.id]=state.messages[s.id].slice(-12);delete state.drafts[s.id];const extra=state.extra.find(x=>x.id===s.id);if(extra){extra.title=text.slice(0,38);extra.snippet=text.slice(0,80);extra.status='idle';}persist();render();const scroll=$('.content-scroll');if(scroll)scroll.scrollTop=scroll.scrollHeight;$('#draft')?.focus();toast('消息已加入演示信息流，未调用真实 Agent');}
function transferFeedback(){const ref=previewRef||resourceFor(session());const value=(state.resourceFeedback?.[ref.id]||'').trim().slice(0,2000);const targetId=$('#feedback-target')?.value||ref.origin;const target=feedbackSessions(ref).find(x=>x.id===targetId);if(!value||!target)return;state.drafts[target.id]=`关于文件「${ref.title}」\n机器：${machineName()} / 空间：${workspace(ref.space).name}\n路径：${ref.path}\n观察版本：${ref.version}（文件可能继续变化）\n\n${value}`.slice(0,2000);if(activeModal)closeModal();navigate({machine:workspace(target.space).machine,section:'sessions',sid:target.id,space:target.space,showDetail:true,tab:'flow'});$('#draft')?.focus();toast('已带入目标会话草稿，请检查后发送');}
function toggleOffline(){saveScroll();const prior=phase();state.offline=!state.offline;state.offlinePhase=state.offline?prior:null;render();toast(state.offline?'已模拟断线：保留最后内容，可继续写草稿':'已模拟重新连接：核对并更新当前请求状态');}
function decide(value){if(state.offline||phase()!=='pending')return;saveScroll();state.decision={value,at:Date.now()};persist();render();}
function reset(){if(activeModal)closeModal();state=defaults();returnTrail=[];persist();$('#scenario').value='normal';render();toast('已恢复初始演示');}
document.addEventListener('click',event=>{if(event.target.classList.contains('modal-overlay')){closeModal();return;}const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const {action,id}=b.dataset;switch(action){case'tools':toolScope=workspace(state.section==='spaces'?state.space:session().space).id;openModal('tools');break;case'tool':openModal('tool',id);break;case'tools-return':openModal('tools');break;case'tools-file':toolScope=session().space;openModal('tool','files');break;case'file-open':previewRef=resourceFor({space:toolScope,id:session().id});openModal('artifact');break;case'view-mode':viewVariant=id;render();break;case'view-failure':viewFailed=!viewFailed;render();break;case'view-draft':state.drafts.wm='请把项目视图改成验收优先的看板。保留原生执行记录入口，先生成未激活候选，不改变在途 Run。';navigate({section:'sessions',sid:'wm',space:'camp-wm',showDetail:true,tab:'flow'});toast('已写入 WorkflowManager 草稿');break;case'native-flow':navigate({section:'sessions',sid:'exec',space:'camp-exec',showDetail:true,tab:'flow'});break;case'terminal-run':terminalOutput=($('#terminal-command')?.value||'').trim()==='pwd'?workspace(toolScope).path:'原型只演示输入与输出，不执行系统命令。';renderModal();break;case'preference':uiDensity=id;renderModal();toast('已选择本地演示偏好');break;case'feedback-preview':productFeedback=$('#product-feedback')?.value||'';feedbackPrepared=true;renderModal();break;case'reading-filter':readingFilter=id;renderModal();break;case'nav':navSection(id);break;case'session':openSession(id);break;case'back':back();break;case'tab':setTab(id);break;case'filter':state.filter=id;state.query='';render();break;case'expand':state.expanded=state.expanded.includes(id)?state.expanded.filter(x=>x!==id):[...state.expanded,id];render();break;case'space':navigate({section:'spaces',space:id,showDetail:true});break;case'space-session':navigate({section:'sessions'});openSession(id);break;case'details':openModal('details',id);break;case'machines':openModal('machines');break;case'machine':closeModal();state.query='';state.filter='all';navigate({machine:id,section:'sessions',sid:id==='studio'?'pm':'travel',space:id==='studio'?'camp':'travel',showDetail:false,tab:'flow'});break;case'new':beginDraft(id);break;case'modal-new':closeModal();beginDraft(id);break;case'choose-agent':newSpace=$('#new-space').value;newAgent=id;renderModal();document.querySelector(`[data-action="choose-agent"][data-id="${id}"]`)?.focus();break;case'create-draft':createDraft();break;case'close-modal':closeModal();break;case'modal-session':closeModal();openSession(id);break;case'context':openModal('context');break;case'context-replace':closeModal();openModal('context');break;case'change-machine':closeModal();openModal('machines');break;case'agent-info':openModal('agent');break;case'session-menu':openModal('session-menu');break;case'replace-details':closeModal();openModal('details',id);break;case'back-list':closeModal();navigate({section:'sessions',showDetail:false});break;case'artifact':previewRef=RESOURCES.find(x=>x.id===id)||resourceFor(session());openModal('artifact');break;case'scene':state.scene=id;refreshScene();break;case'walk':{const bounds=b.getBoundingClientRect();state.character=event.detail===0?(state.character>70?30:state.character+10):Math.max(12,Math.min(86,100*(event.clientX-bounds.left)/bounds.width));refreshScene();break;}case'feedback':transferFeedback();break;case'send':send();break;case'approve':decide('approved');break;case'reject':decide('rejected');break;case'expire':closeModal();decide('expired');break;case'reconnect':if(state.offline)toggleOffline();break;case'about':openModal('about');break;case'reset-demo':reset();break;}});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='search'){state.query=t.value;$('.list-scroll').innerHTML=listContent();}if(t.id==='draft'){state.drafts[state.sid]=t.value.slice(0,2000);persist();const b=$('[data-action="send"]');if(b)b.disabled=state.offline||!t.value.trim();t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px';}if(t.id==='feedback-modal'){const ref=previewRef||resourceFor(session());state.resourceFeedback[ref.id]=t.value.slice(0,2000);persist();document.querySelectorAll('[data-action="feedback"]').forEach(b=>b.disabled=!t.value.trim());}if(t.id==='feedback-target'){state.feedbackTargets[previewRef.id]=t.value;persist();}});
document.addEventListener('keydown',event=>{if(activeModal){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const list=Array.from($('#overlay').querySelectorAll('button:not(:disabled),a[href],input,textarea,select,summary')).filter(el=>el.getBoundingClientRect().height>0);const first=list[0],last=list[list.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}return;}if(event.target.id==='draft'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send();}});
$('#desktopView').addEventListener('click',()=>{$('#device').classList.remove('phone');$('#desktopView').classList.add('active');$('#phoneView').classList.remove('active');$('#desktopView').setAttribute('aria-pressed','true');$('#phoneView').setAttribute('aria-pressed','false');});
$('#phoneView').addEventListener('click',()=>{saveScroll();$('#device').classList.add('phone');$('#phoneView').classList.add('active');$('#desktopView').classList.remove('active');$('#phoneView').setAttribute('aria-pressed','true');$('#desktopView').setAttribute('aria-pressed','false');});
$('#connectionToggle').addEventListener('click',toggleOffline);$('#reset').addEventListener('click',reset);$('#about').addEventListener('click',()=>openModal('about'));
$('#scenario').addEventListener('change',event=>{const val=event.target.value;state.offline=false;state.blocked=val==='blocked';if(val==='approval'){state.decision=null;navigate({machine:'studio',section:'inbox',sid:'launch',space:'orbit',showDetail:true,tab:'flow'});}else navigate({machine:'studio',section:'sessions',sid:val==='blocked'?'exec':'pm',space:val==='blocked'?'camp-exec':'camp',showDetail:true,tab:'flow'});});
window.addEventListener('popstate',event=>{const r=event.state?.route;if(event.state?.genehubPrototype&&r&&['studio','laptop'].includes(r.machine)&&['sessions','spaces','inbox'].includes(r.section)){navigate(r,false);returnTrail.pop();}});
function updateViewport(){const height=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--vh',height+'px');}
window.visualViewport?.addEventListener('resize',updateViewport);window.addEventListener('resize',updateViewport);updateViewport();
// Timers only simulate a saved decision being dispatched by a backend. Time is
// persisted so reload can reconstruct the demo phase; no exactly-once claim.
setInterval(()=>{if(phase()!==lastPhase&&!state.offline){saveScroll();render();persist();}},250);
window.addEventListener('pagehide',()=>{saveScroll();persist();});
try{history.replaceState({genehubPrototype:true,route:route()},'');}catch{}
render();
</script>
</body>
